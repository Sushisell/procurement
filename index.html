<!doctype html>
<html lang="ru">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <style>
    :root {
      --bg: #f5f7fb;
      --card: #ffffff;
      --text: #172033;
      --muted: #667085;
      --primary: #1570ef;
      --primary-dark: #175cd3;
      --border: #d0d5dd;
      --success: #039855;
      --danger: #d92d20;
      --shadow: 0 12px 28px rgba(16, 24, 40, .10);
      --product-header-top: 0px;
      --product-name-size: 18px;
      --product-meta-size: 16px;
    }

    * { box-sizing: border-box; }

    html {
      min-height: 100%;
      touch-action: manipulation;
      -webkit-text-size-adjust: 100%;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      font-size: 16px;
    }

    .app {
      min-height: 100vh;
      padding: 14px 14px calc(96px + env(safe-area-inset-bottom));
      max-width: 820px;
      margin: 0 auto;
    }

    .header {
      position: relative;
      padding: 12px 0 10px;
      background: linear-gradient(180deg, var(--bg) 80%, rgba(245, 247, 251, 0));
    }

    .version-badge {
      display: inline-block;
      margin-left: 8px;
      padding: 4px 8px;
      border: 1px solid rgba(208, 213, 221, .9);
      border-radius: 999px;
      background: rgba(255, 255, 255, .92);
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
      vertical-align: middle;
    }

    .title {
      margin: 0 0 6px;
      font-size: 24px;
      line-height: 1.15;
      font-weight: 800;
    }

    .subtitle { margin: 0; color: var(--muted); font-size: 14px; }

    .card {
      background: var(--card);
      border: 1px solid rgba(208, 213, 221, .8);
      border-radius: 18px;
      padding: 10px;
      margin: 8px 0;
      box-shadow: var(--shadow);
    }

    .setup-grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      gap: 8px;
      align-items: end;
    }

    label {
      display: block;
      margin: 0 0 4px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
      line-height: 1.1;
      text-transform: uppercase;
      letter-spacing: .03em;
    }

    select, input[type="date"], input[type="number"], input[type="search"], .date-picker-button {
      width: 100%;
      min-height: 42px;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 8px 10px;
      font: inherit;
      font-size: max(16px, 1em);
      background: #fff;
    }

    .date-picker { position: relative; }
    .date-picker-button { text-align: left; color: var(--text); }
    .date-picker-button::after { content: '📅'; float: right; }
    .calendar-popover { position: absolute; top: calc(100% + 6px); left: 0; z-index: 50; width: min(330px, calc(100vw - 36px)); padding: 10px; border: 1px solid var(--border); border-radius: 14px; background: #fff; box-shadow: var(--shadow); }
    .calendar-head { display: grid; grid-template-columns: 36px 1fr 36px; align-items: center; margin-bottom: 8px; text-align: center; font-weight: 750; }
    .calendar-head button { height: 34px; border: 0; border-radius: 9px; background: #eef4ff; color: var(--primary-dark); font-size: 20px; }
    .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; }
    .calendar-weekday { padding: 4px 0; color: var(--muted); font-size: 11px; text-align: center; }
    .calendar-day { min-height: 34px; border: 0; border-radius: 9px; background: transparent; color: var(--text); }
    .calendar-day.selected { background: var(--primary); color: #fff; font-weight: 750; }
    .calendar-day:disabled { color: #b8bec9; text-decoration: line-through; background: #f2f4f7; }
    .calendar-day.outside { visibility: hidden; }

    .supplier-card {
      border-radius: 18px;
      border: 1px solid var(--border);
      padding: 14px;
      background: #fff;
      margin: 10px 0 14px;
    }

    .supplier-top {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
    }

    .supplier-name { font-size: 20px; font-weight: 800; margin: 0; }
    .supplier-summary {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .summary-cloud {
      min-height: 68px;
      padding: 11px 12px;
      border-radius: 18px;
      background: #eff8ff;
      color: #1849a9;
      font-weight: 800;
    }

    .summary-cloud.total {
      background: #ecfdf3;
      color: #027a48;
    }

    .summary-label {
      display: block;
      margin-bottom: 5px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.1;
      text-transform: uppercase;
      letter-spacing: .03em;
    }

    .summary-value {
      display: block;
      font-size: 17px;
      line-height: 1.2;
    }

    .meta { color: var(--muted); font-size: 14px; margin-top: 8px; white-space: pre-line; }
    .save-hint {
      margin-top: 8px;
      padding: 9px 11px;
      border-radius: 12px;
      background: #fff4ed;
      color: #b93815;
      font-size: 14px;
      font-weight: 700;
      line-height: 1.35;
    }
    .phones a { color: var(--primary-dark); font-weight: 700; text-decoration: none; }

    .product-table {
      margin-top: 10px;
      border: 1px solid #eaecf0;
      border-radius: 16px;
      overflow: visible;
      background: #fff;
    }

    .product-sticky-head {
      position: sticky;
      top: var(--product-header-top);
      z-index: 14;
      overflow: hidden;
      border-radius: 16px 16px 0 0;
      background: #eef4ff;
      box-shadow: 0 8px 18px rgba(16, 24, 40, .12);
    }

    .product-sum-label {
      display: block;
      color: var(--muted);
      font-size: 11px;
      font-weight: 900;
      line-height: 1.1;
      text-transform: uppercase;
      letter-spacing: .03em;
    }

    .product-sum-value {
      display: block;
      margin-top: 2px;
      font-size: 15px;
      font-weight: 900;
      line-height: 1.15;
    }

    .product-sum-value.total { color: var(--success); }

    .product-row {
      display: grid;
      grid-template-columns: minmax(150px, 1fr) 92px 92px 104px;
      gap: 10px;
      align-items: center;
      padding: 13px 12px;
      border-top: 1px solid #eaecf0;
    }

    .product-row:first-child { border-top: 0; }

    .product-header {
      background: #eef4ff;
      color: #1849a9;
      font-size: 12px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: .03em;
      border-top: 0;
      border-bottom: 1px solid #b2ccff;
    }

    .product-name { font-weight: 800; font-size: var(--product-name-size); line-height: 1.22; }
    .product-price, .product-unit { color: var(--muted); font-size: var(--product-meta-size); }
    .line-total { margin-top: 5px; color: var(--success); font-size: 15px; font-weight: 800; }
    .qty { text-align: center; font-weight: 800; font-size: 18px !important; }

    @media (max-width: 760px) {
      :root {
        --product-header-top: 122px;
        --product-name-size: 17px;
        --product-meta-size: 15px;
      }

      body { font-size: 18px; }

      .app {
        max-width: none;
        padding: 14px 10px calc(112px + env(safe-area-inset-bottom));
      }

      .title { font-size: 24px; }
      .subtitle, .meta { font-size: 15px; }
      .version-badge { font-size: 13px; }

      .header { padding-bottom: 6px; }

      .setup-grid {
        grid-template-columns: 1fr 1fr;
      }

      .setup-field.date-field input { min-height: 46px; }
      .supplier-name { font-size: 23px; }
      .summary-label, .product-header { font-size: 13px; }
      .summary-value { font-size: 19px; }
      .line-total { font-size: 15px; }
      .total-label { font-size: 15px; }
      .total-value { font-size: 16px; line-height: 1.2; }

      .product-table {
        overflow: visible;
      }

      .product-row {
        grid-template-columns: minmax(0, 1fr) 58px 74px 88px;
        gap: 6px;
        padding: 14px 10px;
      }
    }

    @media (max-width: 420px) {
      :root {
        --product-name-size: 16px;
        --product-meta-size: 14px;
      }

      .app { padding-left: 8px; padding-right: 8px; }
      .card, .supplier-card { border-radius: 16px; }
      .product-row { grid-template-columns: minmax(0, 1fr) 52px 64px 80px; }
      .product-header { font-size: 11px; }
    }

    .bottom-bar {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 30;
      padding: 10px 14px calc(10px + env(safe-area-inset-bottom));
      background: rgba(255, 255, 255, .96);
      border-top: 1px solid var(--border);
      backdrop-filter: blur(12px);
    }

    .bottom-inner {
      max-width: 820px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 1.2fr;
      gap: 10px;
      align-items: center;
    }

    .total-label { color: var(--muted); font-size: 13px; }
    .total-value { font-size: 18px; font-weight: 750; line-height: 1.15; }
    .total-minimum { margin-top: 2px; color: var(--muted); font-size: 12px; font-weight: 500; }
    .total-minimum.short { color: var(--danger); }
    .total-minimum.ok { color: var(--success); }

    button.primary {
      min-height: 52px;
      border: 0;
      border-radius: 16px;
      background: var(--primary);
      color: #fff;
      font: inherit;
      font-weight: 900;
    }

    button.primary:disabled { opacity: .55; }
    .setup-authorize { grid-column: 1 / -1; }
    .hidden { display: none !important; }
    .empty, .error { padding: 20px; text-align: center; color: var(--muted); }
    .error { color: var(--danger); }
    .toast { margin-top: 10px; font-size: 14px; color: var(--muted); }

    /* Compact mobile ordering layout */
    .supplier-card { padding: 10px 12px; box-shadow: var(--shadow); }
    .supplier-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .supplier-name { font-size: 16px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .supplier-inline { font-size: 13px; font-weight: 800; white-space: nowrap; }
    .supplier-inline.ok { color: var(--success); }
    .supplier-inline.short { color: var(--danger); }
    .supplier-controls { display: flex; gap: 8px; align-items: end; margin-top: 8px; }
    .supplier-controls input { min-height: 38px; padding: 6px 8px; }
    .conditions { border: 0; background: #eef4ff; color: #1849a9; border-radius: 10px; min-height: 38px; padding: 0 10px; font-weight: 800; }
    .search-tools { display: grid; grid-template-columns: 1fr auto; gap: 8px; margin: 8px 0; }
    .filter-button { border: 1px solid var(--border); border-radius: 12px; background: white; padding: 0 12px; font-weight: 750; }
    .filter-button.active { background: #eef4ff; color: #1849a9; border-color: #84adff; }
    .product-table { overflow: visible; margin-top: 0; }
    .product-row { display: grid; grid-template-columns: minmax(0, 1fr) 60px 98px; align-items: center; gap: 6px; min-height: 50px; padding: 7px 8px; transition: background .15s ease; }
    .product-row.selected { background: #ecfdf3; }
    .product-main { min-width: 0; }
    .product-name { min-width: 0; overflow-wrap: anywhere; white-space: normal; font-size: 14px; }
    .product-price, .product-unit { color: var(--muted); font-size: 12px; text-align: right; font-variant-numeric: tabular-nums; }
    .quantity-control { display: flex; min-width: 0; flex-direction: column; align-items: center; gap: 4px; }
    .quantity-control .product-price { color: var(--danger); text-align: center; white-space: nowrap; }
    .ordered-amount { grid-column: 1 / -1; color: var(--success); font-size: 11px; font-weight: 850; line-height: 1.15; text-align: center; }
    .product-header span { min-width: 0; text-align: right; white-space: normal; overflow-wrap: normal; }
    .product-header span:first-child { text-align: left; }
    .availability-notice { margin: 10px 0; padding: 16px; border: 1px solid #fda29b; border-radius: 16px; background: #fef3f2; color: #b42318; font-size: 15px; line-height: 1.45; }
    .availability-notice strong { display: block; margin-bottom: 5px; }
    .stepper { display: grid; grid-template-columns: 34px 30px 34px; align-items: center; }
    .stepper button { width: 34px; height: 34px; border: 1px solid var(--border); background: #fff; color: var(--primary-dark); font-size: 22px; font-weight: 800; line-height: 1; }
    .stepper button:first-child { border-radius: 10px 0 0 10px; }
    .stepper button:last-child { border-radius: 0 10px 10px 0; }
    .qty-value { text-align: center; font-weight: 850; font-variant-numeric: tabular-nums; }
    .setup-grid { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
    .setup-grid select { min-width: 0; padding-left: 7px; padding-right: 4px; font-size: 14px; }
    .setup-field label { font-size: 10px; }
    .mode-switch { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; margin: 4px 0 10px; padding: 4px; border-radius: 14px; background: #e4e7ec; }
    .mode-button { min-width: 0; min-height: 42px; padding: 6px 3px; border: 0; border-radius: 11px; background: transparent; color: var(--muted); font: inherit; font-size: 12px; font-weight: 850; overflow-wrap: anywhere; }
    .mode-button.active { background: #fff; color: var(--primary-dark); box-shadow: 0 2px 8px rgba(16, 24, 40, .12); }
    .receipt-head { display: flex; justify-content: space-between; gap: 10px; align-items: start; }
    .receipt-title { margin: 0; font-size: 19px; }
    .receipt-meta { margin-top: 5px; color: var(--muted); font-size: 14px; }
    .refresh-button { border: 1px solid var(--border); border-radius: 11px; background: #fff; padding: 8px 10px; color: var(--primary-dark); font-weight: 800; }
    .receipt-row { padding: 12px 0; border-top: 1px solid #eaecf0; }
    .receipt-row:first-child { border-top: 0; }
    .receipt-ordered { margin-bottom: 8px; font-weight: 800; }
    .receipt-fields { display: grid; grid-template-columns: minmax(0, 1fr) 100px; gap: 8px; }
    .receipt-fields label { text-transform: none; letter-spacing: 0; }
    .receipt-fields input { min-height: 44px; }
    .receipt-fields input:not([type="number"]) { width: 100%; border: 1px solid var(--border); border-radius: 12px; padding: 8px 10px; font: inherit; }
    .received-note { margin: 10px 0 0; padding: 9px 11px; border-radius: 12px; background: #ecfdf3; color: #027a48; font-size: 13px; font-weight: 400; line-height: 1.35; }
    .receipt-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
    .secondary-action { min-height: 44px; border: 1px solid var(--primary); border-radius: 12px; background: #fff; color: var(--primary-dark); font-weight: 850; }
    .edit-stepper { display: grid; grid-template-columns: 40px 1fr 40px; align-items: center; max-width: 180px; }
    .edit-stepper button { height: 40px; border: 1px solid var(--border); background: #fff; color: var(--primary-dark); font-size: 22px; }
    .edit-stepper output { text-align: center; font-weight: 850; }
    .draft-notice { margin: 10px 0; padding: 14px; border: 1px solid #84adff; border-radius: 14px; background: #eef4ff; color: #1849a9; font-weight: 800; }
    .draft-notice button { margin-top: 10px; width: 100%; }
    .success-screen { padding: 28px 18px; text-align: center; }
    .success-screen h2 { margin: 0 0 10px; color: var(--success); }
    .archive-items { margin-top: 10px; color: var(--muted); }
    .plan-box { min-width: 86px; padding: 8px; border-radius: 12px; background: #eef4ff; color: #1849a9; text-align: center; }
    .plan-box strong { display: block; font-size: 18px; }
    .plan-box small { display: block; margin-top: 2px; color: var(--muted); }
    .receipt-fields.readonly { grid-template-columns: 92px minmax(0, 1fr); align-items: end; }
    .receipt-fields input:disabled, [data-edit-price] button:disabled { background: #f2f4f7; color: #98a2b3; cursor: not-allowed; }
    .locked-link { display: inline-block; margin-top: 8px; color: var(--primary-dark); font-weight: 850; }
    .loading-overlay { position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; padding: 24px; background: rgba(23, 32, 51, .42); backdrop-filter: blur(3px); }
    .loading-dialog { width: min(360px, 100%); padding: 22px; border-radius: 18px; background: #fff; box-shadow: var(--shadow); text-align: center; }
    .loading-dialog progress { width: 100%; height: 14px; margin: 14px 0 8px; accent-color: var(--primary); }
    @media (min-width: 560px) { .product-name { font-size: 15px; } }
    @media (max-width: 420px) {
      .product-row { grid-template-columns: minmax(0, 1fr) 52px 92px; gap: 4px; }
      .product-header { font-size: 9px; letter-spacing: 0; }
    }
  </style>
</head>
<body>
  <div id="loadingOverlay" class="loading-overlay hidden" role="dialog" aria-live="polite" aria-label="Загрузка данных">
    <div class="loading-dialog"><strong>Загружаю данные разделов</strong><progress id="loadingProgress" max="100" value="0"></progress><div id="loadingProgressText">0%</div></div>
  </div>
  <main class="app">
    <header class="header">
      <h1 class="title">Заявка на продукты <span id="appVersion" class="version-badge">v0.11.0</span></h1>
      <p id="subtitle" class="subtitle">Выберите филиал, ФИО, дату и поставщика.</p>
    </header>

    <nav id="modeSwitch" class="mode-switch hidden" aria-label="Раздел">
      <button id="orderMode" class="mode-button active" type="button">Новая заявка</button>
      <button id="correctionMode" class="mode-button" type="button">Корректировка</button>
      <button id="receiptMode" class="mode-button" type="button">Приёмка</button>
      <button id="archiveMode" class="mode-button" type="button">Архив</button>
    </nav>

    <section id="setup" class="card">
      <div id="loading">Загружаю справочники…</div>
      <div id="setupFields" class="setup-grid hidden">
        <div class="setup-field">
          <label for="branch">Филиал</label>
          <select id="branch"></select>
        </div>

        <div class="setup-field">
          <label for="employee">ФИО</label>
          <select id="employee"></select>
        </div>

        <div class="setup-field date-field auth-hidden hidden">
          <label for="dateButton">Дата поставки (Красноярск)</label>
          <div class="date-picker">
            <button id="dateButton" class="date-picker-button" type="button" aria-haspopup="dialog" aria-expanded="false"></button>
            <input id="date" type="hidden">
            <div id="calendar" class="calendar-popover hidden" role="dialog" aria-label="Выбор даты поставки"></div>
          </div>
        </div>

        <div class="setup-field supplier-field">
          <label for="supplier">Поставщик</label>
          <select id="supplier"></select>
        </div>
        <button id="authorize" class="primary setup-authorize" type="button">Продолжить</button>
      </div>
      <div id="loadError" class="error hidden"></div>
    </section>

    <section id="order" class="hidden">
      <div class="search-tools"><input id="search" type="search" placeholder="Найти товар"><button id="selectedOnly" class="filter-button" type="button">Выбранные</button></div>
      <div id="supplierPanel"></div>
    </section>
    <section id="receipt" class="hidden">
      <div id="receiptPanel" class="card"><div class="empty">Выберите филиал, чтобы загрузить последнюю заявку.</div></div>
    </section>
    <section id="success" class="hidden"></section>
  </main>

  <footer id="bottomBar" class="bottom-bar hidden">
    <div class="bottom-inner">
      <div>
        <div id="footerLabel" class="total-label">Общая сумма</div>
        <div id="grandTotal" class="total-value">—</div>
        <div id="footerMinimum" class="total-minimum"></div>
      </div>
      <button id="submit" class="primary" disabled>Отправить</button>
    </div>
    <div id="status" class="toast" role="status" aria-live="polite"></div>
  </footer>

  <script>
    const APP_VERSION = 'v0.12.0';
    const DEFAULT_API_URL = 'https://script.google.com/macros/s/AKfycbzH9AQ4EGl_EjaxR8Ii7jfHxx2lXdjMCfgOesNH9DVE_MI_u32yy_h0ttrJB-JmG_hmRg/exec';
    const API_URL = window.PROCUREMENT_API_URL || new URLSearchParams(window.location.search).get('api') || DEFAULT_API_URL;
    const hasAppsScriptBridge = Boolean(window.google?.script?.run);

    const state = {
      data: null,
      activeSupplier: '',
      quantities: {},
      submitting: false,
      selectedOnly: false,
      mode: 'order',
      latestOrder: null,
      receiptOrders: [],
      loadingReceipt: false,
      loadingDrafts: false,
      draftOrders: [],
      ordersCache: {},
      prefetchGeneration: 0,
      authorized: false,
      authorizedSupplier: '',
      calendarMonth: '',
    };

    const el = (id) => document.getElementById(id);
    const money = (value) => new Intl.NumberFormat('ru-RU', { style: 'currency', currency: 'RUB', maximumFractionDigits: 0 }).format(value || 0);

    disablePageZoom();

    loadBootstrapData();

    function init(data) {
      state.data = data;
      el('loading').classList.add('hidden');
      el('setupFields').classList.remove('hidden');
      el('date').value = data.today;
      el('date').min = data.today;
      state.calendarMonth = data.today.slice(0, 7);
      updateDateButton();
      el('appVersion').textContent = APP_VERSION;

      renderBranches();
      renderEmployees();
      renderAuthorizationSuppliers();
      bindEvents();
      updateStickyHeaderOffset();
      el('subtitle').textContent = 'Выберите филиал, ФИО и поставщика для загрузки рабочего места.';
    }

    function bindEvents() {
      el('branch').addEventListener('change', () => {
        renderEmployees();
        if (!state.authorized) return;
        state.ordersCache = {};
        prefetchTabs();
        if (state.mode === 'order') loadDrafts(); else loadLatestOrder();
        updateSubmitState();
      });
      el('employee').addEventListener('change', () => {
        if (!state.authorized) return;
        // В корректировке не перерисовываем список: иначе выбор сотрудника после
        // изменения количества сбросит ещё не сохранённые правки.
        if (state.mode === 'correction') updateCorrectionSummary();
        else if (state.mode !== 'order') renderReceipt();
        updateSubmitState();
      });
      el('date').addEventListener('change', () => {
        if (state.mode !== 'order') {
          state.ordersCache = {};
          prefetchTabs();
          loadLatestOrder();
          return;
        }
        renderSupplierOptions();
        renderSupplier();
        updateTotals();
        state.ordersCache = {};
        prefetchTabs();
        loadDrafts();
      });
      el('dateButton').addEventListener('click', () => toggleCalendar());
      document.addEventListener('click', (event) => {
        if (!event.target.closest('.date-picker')) closeCalendar();
      });
      el('supplier').addEventListener('change', () => {
        if (!state.authorized) return;
        state.activeSupplier = el('supplier').value;
        if (state.mode === 'correction') {
          state.latestOrder = state.receiptOrders.find((order) => order.supplier === state.activeSupplier) || null;
          renderReceipt();
          updateSubmitState();
          return;
        }
        renderSupplier();
        updateTotals();
      });
      el('search').addEventListener('input', renderSupplier);
      el('selectedOnly').addEventListener('click', () => { state.selectedOnly = !state.selectedOnly; el('selectedOnly').classList.toggle('active', state.selectedOnly); renderSupplier(); });
      window.addEventListener('resize', updateStickyHeaderOffset);
      window.addEventListener('orientationchange', updateStickyHeaderOffset);
      el('submit').addEventListener('click', submitOrder);
      el('authorize').addEventListener('click', authorizeWorkspace);
      el('orderMode').addEventListener('click', () => setMode('order'));
      el('correctionMode').addEventListener('click', () => setMode('correction'));
      el('receiptMode').addEventListener('click', () => setMode('receipt'));
      el('archiveMode').addEventListener('click', () => setMode('archive'));
    }

    function renderBranches() {
      const options = ['<option value="">Выберите филиал</option>']
        .concat(state.data.branches.map((branch) => `<option>${escapeHtml(branch.name)}</option>`));
      el('branch').innerHTML = options.join('');
    }

    function renderEmployees() {
      const branch = el('branch').value;
      const employees = state.data.employeesByBranch[branch] || [];
      const options = ['<option value="">Выберите ФИО</option>']
        .concat(employees.map((name) => `<option>${escapeHtml(name)}</option>`));
      el('employee').innerHTML = options.join('');
    }

    function renderAuthorizationSuppliers() {
      el('supplier').innerHTML = ['<option value="">Выберите поставщика</option>']
        .concat((state.data.supplierNames || []).map((supplier) => `<option value="${escapeAttr(supplier)}">${escapeHtml(supplier)}</option>`))
        .join('');
    }

    function authorizeWorkspace() {
      const branch = el('branch').value;
      const employee = el('employee').value;
      const supplier = el('supplier').value;
      if (!branch || !employee || !supplier) {
        el('loadError').textContent = 'Выберите филиал, ФИО и поставщика.';
        el('loadError').classList.remove('hidden');
        return;
      }
      el('authorize').disabled = true;
      el('authorize').textContent = 'Загрузка…';
      el('loadError').classList.add('hidden');
      runServer('getWorkspaceData', { branch, employee, supplier })
        .then((workspace) => {
          state.data = { ...state.data, ...workspace };
          state.authorized = true;
          state.authorizedSupplier = supplier;
          state.activeSupplier = supplier;
          el('branch').disabled = true;
          el('employee').disabled = true;
          el('supplier').disabled = true;
          el('authorize').classList.add('hidden');
          el('date').closest('.setup-field').classList.remove('hidden');
          el('modeSwitch').classList.remove('hidden');
          el('bottomBar').classList.remove('hidden');
          el('order').classList.remove('hidden');
          renderSupplierOptions();
          renderSupplier();
          updateTotals();
          loadDrafts();
          prefetchTabs();
          el('subtitle').textContent = 'Рабочее место загружено для выбранного филиала и поставщика.';
        })
        .catch((error) => {
          el('authorize').disabled = false;
          el('authorize').textContent = 'Продолжить';
          el('loadError').textContent = error.message || String(error);
          el('loadError').classList.remove('hidden');
        });
    }

    function renderSupplierOptions() {
      const date = el('date').value;
      const availableGroups = state.data.catalog.filter((group) => {
        const info = state.data.suppliers[group.supplier] || {};
        return date && !isDateUnavailable(info, date);
      });
      if (!availableGroups.some((group) => group.supplier === state.activeSupplier)) {
        state.activeSupplier = availableGroups[0]?.supplier || '';
      }
      el('supplier').innerHTML = availableGroups.length
        ? availableGroups.map((group) => `<option value="${escapeAttr(group.supplier)}"${group.supplier === state.activeSupplier ? ' selected' : ''}>${escapeHtml(group.supplier)}</option>`).join('')
        : '<option value="">Нет доступных поставщиков</option>';
      el('supplier').disabled = !availableGroups.length;
    }

    function renderSupplier() {
      const group = state.data.catalog.find((item) => item.supplier === state.activeSupplier);
      if (!group) {
        el('supplierPanel').innerHTML = '<div class="empty">Нет товаров</div>';
        return;
      }

      const info = state.data.suppliers[group.supplier] || {};
      const query = el('search').value.trim().toLowerCase();
      const products = group.products.filter((item) => item.product.toLowerCase().includes(query) && (!state.selectedOnly || getQuantity(group.supplier, item.product) > 0));
      const unavailable = isSelectedDateUnavailable(info);
      const existingDraft = state.draftOrders.find((order) => sameText(order.supplier, group.supplier));
      const cutoffText = info.deliveryRules?.length
        ? ''
        : (info.cutoffTime
          ? `На сегодня до ${escapeHtml(info.cutoffTime)} по Красноярску`
          : 'График приёма заявок не указан');
      el('supplierPanel').innerHTML = `
        <div class="supplier-card">
          <div class="supplier-top">
            <h2 class="supplier-name">${escapeHtml(group.supplier)}</h2>
          </div>
          <div class="supplier-controls"><button class="conditions" id="conditionsButton" type="button">Условия ⓘ</button></div>
          ${cutoffText ? `<div class="meta">${cutoffText}</div>` : ''}
          <div id="conditionsText" class="meta hidden">${escapeHtml(info.orderInfo || 'Условия не указаны')} ${info.contact ? `<br>${linkPhones(info.contact)}` : ''}</div>
        </div>
        ${existingDraft ? `<div class="draft-notice">Уже есть черновик заявки на эту дату.<button id="openCorrection" class="secondary-action" type="button">Перейти во вкладку «Корректировка»</button></div>` : (unavailable ? renderUnavailableNotice(info) : renderProductTable(group.supplier, products))}
      `;
      el('conditionsButton').addEventListener('click', () => el('conditionsText').classList.toggle('hidden'));
      el('openCorrection')?.addEventListener('click', () => setMode('correction'));

      el('supplierPanel').querySelectorAll('[data-step]').forEach((button) => {
        button.addEventListener('click', () => {
          const { supplier, product, step } = button.dataset;
          state.quantities[key(supplier, product)] = Math.max(0, getQuantity(supplier, product) + Number(step));
          renderSupplier();
          updateTotals();
        });
      });
    }

    function renderProductTable(supplier, products) {
      if (!products.length) return '<div class="empty">По поиску ничего не найдено</div>';
      return `<div class="product-table" role="table">
        <div class="product-sticky-head">
          <div class="product-row product-header" role="row"><span>Наименование</span><span>Кратн.</span><span>Кол-во</span></div>
        </div>
        ${products.map((item) => renderProduct(supplier, item)).join('')}</div>`;
    }

    function renderProduct(supplier, item) {
      const quantity = getQuantity(supplier, item.product);
      const price = priceForDate(item, el('date').value);
      return `
        <div class="product-row ${quantity ? 'selected' : ''}" role="row">
          <div class="product-main">
            <span class="product-name">${escapeHtml(item.product)}</span>
          </div>
          <div class="product-unit">${escapeHtml(item.unit || '1')}</div>
          <div class="quantity-control">
            <div class="stepper" aria-label="Количество">
              <button type="button" data-step="-1" data-supplier="${escapeAttr(supplier)}" data-product="${escapeAttr(item.product)}" aria-label="Уменьшить">−</button>
              <span class="qty-value">${quantity}</span>
              <button type="button" data-step="1" data-supplier="${escapeAttr(supplier)}" data-product="${escapeAttr(item.product)}" aria-label="Увеличить">+</button>
            </div>
            ${quantity ? `<div class="ordered-amount">Заказано: ${escapeHtml(formatOrderedAmount(quantity, item.unit))}</div>` : ''}
            <div class="product-price">по ${money(price)}</div>
          </div>
        </div>`;
    }

    function submitOrder() {
      if (state.mode === 'receipt') return submitReceipt();
      if (state.mode === 'correction') return saveOrderCorrection();
      if (state.submitting) return;
      state.submitting = true;
      updateSubmitState();
      el('status').textContent = 'Отправляю заявку…';

      const payload = {
        branch: el('branch').value,
        employee: el('employee').value,
        date: el('date').value,
        supplier: state.activeSupplier,
        items: collectItems().filter((item) => item.supplier === state.activeSupplier),
      };

      runServer('submitOrder', payload)
        .then((result) => {
          state.submitting = false;
          state.quantities = {};
          el('success').innerHTML = `<div class="card success-screen"><h2>Спасибо за заявку!</h2><p>Заявка сохранена как черновик.</p><p>Корректировка доступна во вкладке «Корректировка» <strong>${escapeHtml(result.correctionUntil || 'до окончания приёма заявок поставщиком')}</strong>.</p><button id="successCorrection" class="secondary-action" type="button">Перейти к корректировке</button></div>`;
          el('successCorrection').addEventListener('click', () => setMode('correction'));
          el('order').classList.add('hidden');
          el('success').classList.remove('hidden');
          el('status').textContent = `Сумма заявки: ${money(result.total)}`;
          state.ordersCache = {};
          prefetchTabs();
          loadDrafts(false);
          updateSubmitState();
        })
        .catch((error) => {
          state.submitting = false;
          el('status').textContent = error.message || String(error);
          updateSubmitState();
        });
    }

    function setMode(mode) {
      state.mode = mode;
      const receiving = mode === 'receipt';
      const ordering = mode === 'order';
      const archive = mode === 'archive';
      el('orderMode').classList.toggle('active', ordering);
      el('correctionMode').classList.toggle('active', mode === 'correction');
      el('receiptMode').classList.toggle('active', receiving);
      el('archiveMode').classList.toggle('active', archive);
      el('order').classList.toggle('hidden', !ordering);
      el('receipt').classList.toggle('hidden', ordering);
      el('success').classList.add('hidden');
      el('date').closest('.setup-field').classList.remove('hidden');
      el('supplier').closest('.setup-field').classList.toggle('hidden', !ordering && mode !== 'correction');
      el('date').min = ordering ? state.data.today : '';
      el('date').closest('.setup-field').querySelector('label').textContent = receiving
        ? 'День получения'
        : 'Дата поставки (Красноярск)';
      el('subtitle').textContent = ordering ? 'Выберите филиал, ФИО, дату и поставщика.'
        : receiving ? 'Здесь доступны только заявки со статусом «Заказано».'
          : archive ? 'Полученные заявки филиала.' : 'Изменяйте отправленные черновики до срока поставщика.';
      el('footerLabel').textContent = ordering ? 'Общая сумма' : 'Выбранная заявка';
      el('footerMinimum').textContent = '';
      if (ordering) { renderSupplierOptions(); renderSupplier(); updateTotals(); loadDrafts(); } else loadLatestOrder();
      updateSubmitState();
    }

    function cacheKey(branch, date, view) { return `${branch}::${date}::${view}`; }

    function previousIsoDate(date) {
      const value = new Date(`${date}T12:00:00Z`);
      value.setUTCDate(value.getUTCDate() - 1);
      return value.toISOString().slice(0, 10);
    }

    function requestOrders(branch, date, view) {
      const keyValue = cacheKey(branch, date, view);
      if (state.ordersCache[keyValue]) return state.ordersCache[keyValue];
      const request = runServer('getOrders', { branch, date, view, supplier: state.authorizedSupplier })
        .then((orders) => orders || [])
        .catch((error) => { delete state.ordersCache[keyValue]; throw error; });
      state.ordersCache[keyValue] = request;
      return request;
    }

    function prefetchTabs() {
      const branch = el('branch').value;
      const date = el('date').value;
      if (!branch || !date) return;
      const generation = ++state.prefetchGeneration;
      const requests = [
        requestOrders(branch, date, 'correction'),
        requestOrders(branch, date, 'receipt'),
        requestOrders(branch, date, 'archive'),
        // Архив автоматически прогреваем только за два дня; более старые даты
        // загружаются отдельно, когда пользователь выбирает их в поле даты.
        requestOrders(branch, previousIsoDate(date), 'archive'),
      ];
      let complete = 0;
      el('loadingOverlay').classList.remove('hidden');
      const updateProgress = () => {
        if (generation !== state.prefetchGeneration) return;
        complete += 1;
        const percent = Math.round(complete / requests.length * 100);
        el('loadingProgress').value = percent;
        el('loadingProgressText').textContent = `${percent}%`;
        if (complete === requests.length) el('loadingOverlay').classList.add('hidden');
      };
      requests.forEach((request) => request.then(updateProgress, updateProgress));
    }

    function loadDrafts(render = true) {
      const branch = el('branch').value;
      const date = el('date').value;
      state.draftOrders = [];
      if (!branch || !date) { state.loadingDrafts = false; if (render) renderSupplier(); return; }
      state.loadingDrafts = true;
      updateSubmitState();
      requestOrders(branch, date, 'correction')
        .then((orders) => {
          if (branch !== el('branch').value || date !== el('date').value) return;
          state.loadingDrafts = false;
          state.draftOrders = (orders || []).filter((order) => order.status === 'submitted');
          if (render && state.mode === 'order') { renderSupplier(); updateSubmitState(); }
        })
        .catch((error) => {
          if (branch !== el('branch').value || date !== el('date').value) return;
          state.loadingDrafts = false;
          el('status').textContent = error.message || String(error);
          updateSubmitState();
        });
    }

    function loadLatestOrder() {
      const branch = el('branch').value;
      const requestedMode = state.mode;
      const requestedDate = el('date').value;
      state.latestOrder = null;
      state.receiptOrders = [];
      if (!branch) {
        renderReceipt();
        updateSubmitState();
        return;
      }
      state.loadingReceipt = true;
      el('receiptPanel').innerHTML = '<div class="empty">Загружаю последнюю заявку…</div>';
      requestOrders(branch, requestedDate, requestedMode)
        .then((orders) => {
          if (branch !== el('branch').value || requestedDate !== el('date').value || requestedMode !== state.mode) return;
          state.loadingReceipt = false;
          state.receiptOrders = orders || [];
          state.latestOrder = state.receiptOrders[0] || null;
          if (state.mode === 'correction') renderCorrectionSupplierOptions();
          renderReceipt();
          updateSubmitState();
        })
        .catch((error) => {
          state.loadingReceipt = false;
          el('receiptPanel').innerHTML = `<div class="error">${escapeHtml(error.message || String(error))}</div>`;
          updateSubmitState();
        });
    }

    function renderCorrectionSupplierOptions() {
      const suppliers = [...new Set(state.receiptOrders.map((order) => order.supplier))];
      if (!suppliers.includes(state.activeSupplier)) state.activeSupplier = suppliers[0] || '';
      el('supplier').innerHTML = suppliers.length
        ? suppliers.map((supplier) => `<option value="${escapeAttr(supplier)}"${supplier === state.activeSupplier ? ' selected' : ''}>${escapeHtml(supplier)}</option>`).join('')
        : '<option value="">Нет черновиков</option>';
      el('supplier').disabled = !suppliers.length;
      state.latestOrder = state.receiptOrders.find((order) => order.supplier === state.activeSupplier) || null;
    }

    function renderReceipt() {
      const order = state.latestOrder;
      if (!el('branch').value) {
        el('receiptPanel').innerHTML = '<div class="empty">Выберите филиал, чтобы загрузить последнюю заявку.</div>';
        el('grandTotal').textContent = '—';
        return;
      }
      if (!order) {
        const emptyText = state.mode === 'correction' ? 'Нет черновиков для корректировки.' : state.mode === 'archive' ? 'В архиве пока нет полученных заявок.' : 'Нет заказанных заявок для приёмки.';
        el('receiptPanel').innerHTML = `<div class="empty">${emptyText}</div>`;
        el('grandTotal').textContent = 'Нет заявок';
        return;
      }
      const receiptItems = Object.fromEntries((order.receipt?.items || []).map((item) => [item.orderedProduct, item]));
      const catalogGroup = state.data.catalog.find((group) => sameText(group.supplier, order.supplier));
      const orderByProduct = Object.fromEntries(order.items.map((item) => [String(item.product).toLocaleLowerCase('ru-RU'), item]));
      const correctionItems = state.mode === 'correction' && catalogGroup
        ? catalogGroup.products.map((item) => ({ ...item, quantity: orderByProduct[item.product.toLocaleLowerCase('ru-RU')]?.quantity || 0 }))
        : order.items;
      const correctionInfo = state.data.suppliers[order.supplier] || {};
      const correctionTotal = correctionItems.reduce((sum, item) => sum + item.quantity * priceForDate(item, order.date), 0);
      const correctionMinimum = minimumNumber(correctionInfo.minimum);
      const formattedDate = new Intl.DateTimeFormat('ru-RU', { day: 'numeric', month: 'long', year: 'numeric' })
        .format(new Date(`${order.date}T00:00:00`));
      el('receiptPanel').innerHTML = `
        ${state.mode === 'correction' ? '' : `<div class="setup-field" style="margin-bottom:12px">
          <label for="receiptSupplier">Поставщик</label>
          <select id="receiptSupplier">${state.receiptOrders.map((item) => `<option value="${escapeAttr(item.id)}"${item.id === order.id ? ' selected' : ''}>${escapeHtml(item.supplier)}</option>`).join('')}</select>
        </div>`}
        <div class="receipt-head">
          <div><h2 class="receipt-title">${escapeHtml(order.supplier || 'Последняя заявка')}</h2>
          <div class="receipt-meta">Поставка ${escapeHtml(formattedDate)} · заказ оформил(а) ${escapeHtml(order.initiator)}</div></div>
          <button id="refreshReceipt" class="refresh-button" type="button">Обновить</button>
        </div>
        ${state.mode === 'correction' && (order.correctionUntil || order.status === 'ordered' || order.lockReason === 'deadline') ? `<div class="received-note">
          ${order.correctionUntil ? `${order.status === 'ordered' ? 'Срок корректировки был до' : 'Корректировка доступна до'} ${escapeHtml(order.correctionUntil)}.` : ''}
          ${order.status === 'ordered' ? '<br>Заявка уже заказана. Следующий этап — приёмка.<br><button id="openReceipt" class="secondary-action locked-link" type="button">Перейти к приёмке →</button>' : ''}
          ${order.status !== 'ordered' && order.lockReason === 'deadline' ? '<br>Срок корректировки истёк.' : ''}</div>` : ''}
        ${state.mode === 'correction' ? `<div id="correctionMinimumWarning" class="meta${correctionMinimum && correctionTotal < correctionMinimum ? '' : ' hidden'}" style="color:var(--danger)">Сумма заявки меньше минимальной. Сохранение недоступно.</div>` : ''}
        <div class="${state.mode === 'correction' ? 'product-table' : ''}" style="margin-top:12px">
        ${state.mode === 'correction' ? '<div class="product-sticky-head"><div class="product-row product-header"><span>Наименование</span><span>Кратн.</span><span>Кол-во / стоимость</span></div></div>' : ''}
        ${correctionItems.filter((item) => {
          const saved = receiptItems[item.product];
          return order.status !== 'ordered' || !saved || saved.actualQuantity < item.quantity;
        }).map((item, index) => {
          const saved = receiptItems[item.product] || {};
          if (state.mode === 'correction') {
            const price = priceForDate(item, order.date);
            return `<div class="product-row${item.quantity ? ' selected' : ''}">
            <div class="product-main"><span class="product-name">${escapeHtml(item.product)}</span></div>
            <div class="product-unit">${escapeHtml(item.unit || '1')}</div>
            <div class="quantity-control" data-edit-product="${escapeAttr(item.product)}" data-edit-price="${price}">
              <div class="stepper"><button type="button" data-edit-step="-1"${order.editable === false ? ' disabled' : ''}>−</button><output class="qty-value">${item.quantity}</output><button type="button" data-edit-step="1"${order.editable === false ? ' disabled' : ''}>+</button></div>
              <div class="product-price">по ${money(price)}</div><div class="line-total${item.quantity ? '' : ' hidden'}">${money(item.quantity * price)}</div>
            </div>
          </div>`;
          }
          if (order.status === 'received') return `<div class="receipt-row"><div class="receipt-ordered">${escapeHtml(item.product)} — ${item.quantity} ${escapeHtml(item.unit || '')}</div><div class="archive-items">Получено полностью</div></div>`;
          const remaining = Math.max(0, item.quantity - (saved.actualQuantity || 0));
          return `<div class="receipt-row">
            <div class="receipt-ordered">${escapeHtml(item.product)}</div>
            <div class="receipt-fields readonly">
              <div class="plan-box"><span>План</span><strong>${remaining}</strong><small>${escapeHtml(item.unit || '')}</small></div>
              <div><label for="actualQuantity${index}">Получено</label><input id="actualQuantity${index}" data-actual-quantity data-ordered-product="${escapeAttr(item.product)}" type="number" min="0" max="${remaining}" step="any" value="0"${!el('employee').value ? ' disabled' : ''}></div>
            </div>
          </div>`;
        }).join('') || '<div class="empty">Все позиции получены полностью.</div>'}</div>
        ${state.mode === 'correction' && order.status === 'submitted' && order.editable !== false ? '<div class="receipt-actions" style="grid-template-columns:1fr"><button id="saveCorrection" class="secondary-action" type="button" aria-describedby="correctionSaveHint">Сохранить изменения</button><div id="correctionSaveHint" class="save-hint hidden" role="status"></div></div>' : ''}`;
      el('refreshReceipt').addEventListener('click', () => {
        delete state.ordersCache[cacheKey(el('branch').value, el('date').value, state.mode)];
        loadLatestOrder();
      });
      el('receiptSupplier')?.addEventListener('change', (event) => {
        state.latestOrder = state.receiptOrders.find((item) => item.id === event.target.value) || null;
        renderReceipt();
        updateSubmitState();
      });
      el('receiptPanel').querySelectorAll('[data-edit-step]').forEach((button) => button.addEventListener('click', () => {
        const output = button.parentElement.querySelector('output');
        output.value = Math.max(0, toClientNumber(output.value) + Number(button.dataset.editStep));
        output.textContent = output.value;
        const row = button.closest('.product-row');
        row.classList.toggle('selected', output.value > 0);
        const lineTotal = row.querySelector('.line-total');
        lineTotal.textContent = money(output.value * toClientNumber(button.closest('[data-edit-price]').dataset.editPrice));
        lineTotal.classList.toggle('hidden', output.value <= 0);
        updateCorrectionSummary();
      }));
      el('saveCorrection')?.addEventListener('click', saveOrderCorrection);
      el('openReceipt')?.addEventListener('click', () => setMode('receipt'));
      el('receiptPanel').querySelectorAll('input').forEach((input) => input.addEventListener('input', updateSubmitState));
      el('grandTotal').textContent = state.mode === 'correction' ? money(correctionTotal) : `${order.items.length} поз.`;
      updateCorrectionSummary();
    }

    function submitReceipt() {
      if (state.submitting || !state.latestOrder) return;
      state.submitting = true;
      updateSubmitState();
      el('status').textContent = 'Сохраняю приёмку…';
      const quantities = Array.from(el('receiptPanel').querySelectorAll('[data-actual-quantity]'));
      const items = quantities.map((input) => ({
        orderedProduct: input.dataset.orderedProduct,
        actualProduct: input.dataset.orderedProduct,
        actualQuantity: toClientNumber(input.value),
      }));
      runServer('receiveOrder', {
        branch: el('branch').value,
        employee: el('employee').value,
        orderId: state.latestOrder.id,
        items,
      }).then(() => {
        state.submitting = false;
        el('status').textContent = 'Приёмка сохранена.';
        state.ordersCache = {};
        prefetchTabs();
        loadLatestOrder();
      }).catch((error) => {
        state.submitting = false;
        el('status').textContent = error.message || String(error);
        updateSubmitState();
      });
    }

    function saveOrderCorrection() {
      if (state.submitting || !state.latestOrder || state.latestOrder.status !== 'submitted' || state.latestOrder.editable === false) return;
      if (!el('employee').value) {
        el('status').textContent = 'Сначала выберите ФИО сотрудника.';
        return;
      }
      const items = Array.from(el('receiptPanel').querySelectorAll('[data-edit-product]')).map((node) => ({
        product: node.dataset.editProduct,
        quantity: toClientNumber(node.querySelector('output').value),
        price: toClientNumber(node.dataset.editPrice),
      }));
      const total = items.reduce((sum, item) => sum + item.quantity * item.price, 0);
      const minimum = minimumNumber((state.data.suppliers[state.latestOrder.supplier] || {}).minimum);
      if (minimum && total < minimum) {
        el('status').textContent = 'Нельзя сохранить: сумма заявки меньше минимальной.';
        return;
      }
      state.submitting = true;
      updateCorrectionSummary();
      el('status').textContent = 'Сохраняю изменения…';
      runServer('updateSubmittedOrder', { branch: el('branch').value, employee: el('employee').value, orderId: state.latestOrder.id, items })
        .then(() => { state.submitting = false; el('status').textContent = 'Изменения сохранены.'; state.ordersCache = {}; prefetchTabs(); loadLatestOrder(); })
        .catch((error) => { state.submitting = false; el('status').textContent = error.message || String(error); updateCorrectionSummary(); });
    }

    function updateCorrectionSummary() {
      if (state.mode !== 'correction' || !state.latestOrder) return;
      const nodes = Array.from(el('receiptPanel').querySelectorAll('[data-edit-product]'));
      const total = nodes.reduce((sum, node) => sum + toClientNumber(node.querySelector('output').value) * toClientNumber(node.dataset.editPrice), 0);
      const info = state.data.suppliers[state.latestOrder.supplier] || {};
      const minimum = minimumNumber(info.minimum);
      const belowMinimum = Boolean(minimum && total < minimum);
      const hasItems = nodes.some((node) => toClientNumber(node.querySelector('output').value) > 0);
      const blockers = [];
      if (!el('employee').value) blockers.push('выберите ФИО сотрудника');
      if (!hasItems) blockers.push('добавьте хотя бы одну позицию');
      if (belowMinimum) blockers.push(`доберите заказ до минимальной суммы (не хватает ${money(minimum - total)})`);
      if (state.submitting) blockers.push('дождитесь завершения сохранения');
      el('grandTotal').textContent = `${money(total)} / мин. ${formatMinimum(info)}`;
      el('footerMinimum').className = `total-minimum ${belowMinimum ? 'short' : 'ok'}`;
      el('footerMinimum').textContent = belowMinimum
        ? `Ещё заказать на ${formatMinimumValue(minimum - total, info)}`
        : 'Минимальный заказ набран ✓';
      el('correctionMinimumWarning')?.classList.toggle('hidden', !belowMinimum);
      const saveButton = el('saveCorrection');
      const saveHint = el('correctionSaveHint');
      if (saveButton) {
        saveButton.disabled = blockers.length > 0;
        saveButton.title = blockers.length ? `Сохранение недоступно: ${blockers.join('; ')}.` : '';
      }
      if (saveHint) {
        saveHint.textContent = blockers.length ? `Почему нельзя сохранить: ${blockers.join('; ')}.` : '';
        saveHint.classList.toggle('hidden', !blockers.length);
      }
      el('submit').disabled = blockers.length > 0;
      el('submit').textContent = state.submitting ? 'Сохранение…' : 'Сохранить изменения';
      el('grandTotal').textContent = money(total);
    }

    function markOrderOrdered() {
      runServer('markOrderOrdered', { branch: el('branch').value, orderId: state.latestOrder.id })
        .then(() => { el('status').textContent = 'Заявка отмечена как заказанная.'; loadLatestOrder(); })
        .catch((error) => { el('status').textContent = error.message || String(error); });
    }

    function loadBootstrapData() {
      runServer('getBootstrapData')
        .then(init)
        .catch(showLoadError);
    }

    function runServer(method, payload) {
      if (hasAppsScriptBridge) return runAppsScript(method, payload);
      if (!API_URL) {
        return Promise.reject(new Error('Для GitHub Pages укажите URL веб-приложения Apps Script: ?api=https://script.google.com/macros/s/.../exec или window.PROCUREMENT_API_URL.'));
      }
      return runHttpApi(method, payload);
    }

    function runAppsScript(method, payload) {
      return new Promise((resolve, reject) => {
        const runner = google.script.run.withSuccessHandler(resolve).withFailureHandler(reject);
        if (payload === undefined) runner[method]();
        else runner[method](payload);
      });
    }

    function runHttpApi(method, payload) {
      const url = new URL(API_URL);
      const actions = { getBootstrapData: 'bootstrap', getWorkspaceData: 'workspace', submitOrder: 'submit', getLatestOrder: 'latestOrder', getOrders: 'orders', receiveOrder: 'receive', updateSubmittedOrder: 'updateOrder', markOrderOrdered: 'markOrdered' };
      url.searchParams.set('action', actions[method] || method);
      const options = method === 'getBootstrapData'
        ? { method: 'GET' }
        : {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(payload),
        };

      return fetch(url.toString(), options)
        .then((response) => response.json())
        .then((result) => {
          if (!result.ok) throw new Error(result.error || 'Ошибка API');
          return result.data;
        });
    }

    function collectItems() {
      const items = [];
      state.data.catalog.forEach((group) => {
        group.products.forEach((item) => {
          const quantity = getQuantity(group.supplier, item.product);
          if (!quantity) return;
          items.push({
            supplier: group.supplier,
            product: item.product,
            price: priceForDate(item, el('date').value),
            unit: item.unit,
            quantity,
          });
        });
      });
      return items;
    }

    function updateTotals() {
      updateFooterTotal();
      updateVisibleSupplierSums();
      updateSubmitState();
    }

    function updateFooterTotal() {
      const minimumNode = el('footerMinimum');
      minimumNode.textContent = '';
      minimumNode.className = 'total-minimum';
      if (state.mode !== 'order') return;
      const group = state.data.catalog.find((item) => item.supplier === state.activeSupplier);
      if (!group) { el('grandTotal').textContent = '—'; return; }
      const info = state.data.suppliers[state.activeSupplier] || {};
      const progress = getMinimumProgress(group, info);
      el('grandTotal').textContent = `${money(getSupplierTotal(group))} / мин. ${formatMinimum(info)}`;
      if (!progress.minimum) return;
      minimumNode.classList.add(progress.missing ? 'short' : 'ok');
      minimumNode.textContent = progress.missing
        ? `Ещё заказать на ${formatMinimumValue(progress.missing, info)}`
        : 'Минимальный заказ набран ✓';
    }

    function updateSubmitState() {
      if (state.mode !== 'order') {
        if (state.mode === 'correction') {
          const canEdit = state.latestOrder?.status === 'submitted' && state.latestOrder.editable !== false;
          if (canEdit) updateCorrectionSummary();
          else {
            el('submit').disabled = true;
            el('submit').textContent = state.loadingReceipt ? 'Загрузка…' : 'Корректировка недоступна';
          }
          return;
        }
        if (state.mode === 'archive') {
          el('submit').disabled = true;
          el('submit').textContent = 'Архив';
          return;
        }
        if (state.latestOrder?.status === 'submitted') {
          el('submit').disabled = true;
          el('submit').textContent = state.latestOrder.editable === false ? 'Время заявки прошло' : 'Сначала отметьте «заказана»';
          return;
        }
        const hasActualItems = Boolean(state.latestOrder) && Array.from(el('receiptPanel').querySelectorAll('[data-actual-quantity]'))
          .some((input) => toClientNumber(input.value) > 0);
        el('submit').disabled = state.submitting || state.loadingReceipt || !el('branch').value || !el('employee').value || !hasActualItems;
        el('submit').textContent = state.submitting ? 'Сохранение…' : 'Сохранить приёмку';
        return;
      }
      const group = state.data.catalog.find((item) => item.supplier === state.activeSupplier);
      const info = state.data.suppliers[state.activeSupplier] || {};
      const currentItems = collectItems().filter((item) => item.supplier === state.activeSupplier);
      const progress = getMinimumProgress(group, info);
      const meetsMinimum = !progress.minimum || !progress.missing;
      const hasDraft = state.draftOrders.some((order) => sameText(order.supplier, state.activeSupplier));
      el('submit').disabled = state.submitting || state.loadingDrafts || hasDraft || !el('branch').value || !el('employee').value || !el('date').value || isSelectedDateUnavailable(info) || !currentItems.length || !meetsMinimum;
      el('submit').textContent = state.submitting ? 'Отправка…' : 'Отправить';
    }

    function priceForDate(item, date) {
      const available = (item.prices || []).filter((entry) => !entry.effectiveDate || entry.effectiveDate <= date);
      return toClientNumber(available.length ? available[available.length - 1].price : item.price);
    }

    function minimumNumber(value) { return toClientNumber(String(value || '').replace(/р\.?/gi, '')); }

    function formatOrderedAmount(quantity, unit) {
      const rawUnit = String(unit || '').trim();
      const amount = new Intl.NumberFormat('ru-RU', { maximumFractionDigits: 2 });
      const unitNumber = toClientNumber(rawUnit);
      if (/кг/i.test(rawUnit) && unitNumber) return `${amount.format(quantity * unitNumber)} кг`;
      const packageMatch = rawUnit.match(/(?:уп(?:ак(?:овк[аи])?)?\.?)[^(\d]*(?:\(\s*)?(\d+(?:[.,]\d+)?)\s*шт/i);
      if (packageMatch) return `${amount.format(quantity)} ${pluralizePackages(quantity)} по ${amount.format(toClientNumber(packageMatch[1]))} шт`;
      if (/кг/i.test(rawUnit)) return `${amount.format(quantity)} кг`;
      if (/уп(?:ак(?:овк[аи])?)?\.?/i.test(rawUnit)) return `${amount.format(quantity)} ${pluralizePackages(quantity)}`;
      return `${amount.format(quantity)} ${rawUnit || 'шт'}`;
    }

    function pluralizePackages(quantity) {
      const value = Math.abs(Math.trunc(quantity)) % 100;
      const last = value % 10;
      if (value > 10 && value < 20) return 'упаковок';
      if (last === 1) return 'упаковка';
      if (last > 1 && last < 5) return 'упаковки';
      return 'упаковок';
    }

    function minimumUnit(info) {
      const unit = String(info.unit || '').trim();
      if (/кг/i.test(unit)) return 'кг';
      if (/(?:шт|штук)/i.test(unit)) return 'шт';
      return '₽';
    }

    function formatMinimum(info) {
      if (!info.minimum) return '—';
      const raw = String(info.minimum).trim();
      return /(?:₽|руб|р\.|кг|шт)/i.test(raw) ? raw : `${raw} ${minimumUnit(info)}`;
    }

    function formatMinimumValue(value, info) {
      return minimumUnit(info) === '₽' ? money(value) : `${new Intl.NumberFormat('ru-RU', { maximumFractionDigits: 2 }).format(value)} ${minimumUnit(info)}`;
    }

    function getMinimumProgress(group, info) {
      const minimum = minimumNumber(info.minimum);
      if (!group) return { minimum, current: 0, missing: minimum };
      const unit = minimumUnit(info);
      let current = getSupplierTotal(group);
      if (unit === 'шт') current = group.products.reduce((sum, item) => sum + getQuantity(group.supplier, item.product), 0);
      if (unit === 'кг') current = group.products.reduce((sum, item) => sum + getQuantity(group.supplier, item.product) * (toClientNumber(item.unit) || 1), 0);
      return { minimum, current, missing: Math.max(0, minimum - current) };
    }

    function isSelectedDateUnavailable(info) {
      const selectedDate = el('date').value;
      if (!selectedDate) return false;
      return isDateUnavailable(info, selectedDate);
    }

    function isDateUnavailable(info, selectedDate) {
      if (info.deliveryRules?.length) {
        return !(info.availableDeliveryDates || []).includes(selectedDate);
      }
      return Boolean(info.earliestDeliveryDate && selectedDate < info.earliestDeliveryDate);
    }

    function renderUnavailableNotice(info) {
      const nextDate = (info.availableDeliveryDates || []).find((date) => date >= el('date').value)
        || info.earliestDeliveryDate;
      const formattedDate = nextDate
        ? new Intl.DateTimeFormat('ru-RU', { day: 'numeric', month: 'long' }).format(new Date(`${nextDate}T00:00:00`))
        : '';
      return `<div class="availability-notice"><strong>Заявку на выбранную дату уже нельзя принять.</strong>Дата не соответствует графику поставщика или время приёма заявки уже прошло.${formattedDate ? `<br>Ближайшая доступная дата — ${escapeHtml(formattedDate)}.` : ''}</div>`;
    }

    function getQuantity(supplier, product) {
      return toClientNumber(state.quantities[key(supplier, product)]);
    }

    function getSupplierTotal(group) {
      return group.products.reduce((sum, item) => sum + getQuantity(group.supplier, item.product) * priceForDate(item, el('date').value), 0);
    }

    function updateVisibleLine(input) {
      const row = input.closest('.product-row');
      if (!row) return;
      const price = toClientNumber(row.querySelector('.product-price')?.dataset.price);
      const total = toClientNumber(input.value) * price;
      const line = row.querySelector('.line-total');
      if (!line) return;
      line.textContent = money(total);
      line.classList.toggle('hidden', !total);
    }

    function updateVisibleSupplierSums() {
      const group = state.data.catalog.find((item) => item.supplier === state.activeSupplier);
      if (!group) return;
      const total = money(getSupplierTotal(group));
      document.querySelectorAll('[data-supplier-total]').forEach((node) => {
        node.textContent = total;
      });
    }

    function updateStickyHeaderOffset() {
      document.documentElement.style.setProperty('--product-header-top', '0px');
    }

    function updateDateButton() {
      const value = el('date').value;
      el('dateButton').textContent = value
        ? new Intl.DateTimeFormat('ru-RU', { day: '2-digit', month: '2-digit', year: 'numeric' }).format(new Date(`${value}T00:00:00`))
        : 'Выберите дату';
    }

    function toggleCalendar() {
      const calendar = el('calendar');
      const opening = calendar.classList.contains('hidden');
      calendar.classList.toggle('hidden', !opening);
      el('dateButton').setAttribute('aria-expanded', String(opening));
      if (opening) renderCalendar();
    }

    function closeCalendar() {
      el('calendar').classList.add('hidden');
      el('dateButton').setAttribute('aria-expanded', 'false');
    }

    function renderCalendar() {
      const [year, month] = state.calendarMonth.split('-').map(Number);
      const monthLabel = new Intl.DateTimeFormat('ru-RU', { month: 'long', year: 'numeric' }).format(new Date(year, month - 1, 1));
      const firstWeekday = (new Date(year, month - 1, 1).getDay() + 6) % 7;
      const days = new Date(year, month, 0).getDate();
      const info = state.data?.suppliers?.[state.activeSupplier] || {};
      const buttons = Array.from({ length: firstWeekday }, () => '<span class="calendar-day outside"></span>');
      for (let day = 1; day <= days; day += 1) {
        const iso = `${year}-${String(month).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
        const disabled = state.mode === 'order' && isDateUnavailable(info, iso);
        buttons.push(`<button class="calendar-day${iso === el('date').value ? ' selected' : ''}" type="button" data-calendar-date="${iso}"${disabled ? ' disabled' : ''}>${day}</button>`);
      }
      el('calendar').innerHTML = `<div class="calendar-head"><button type="button" data-month-step="-1" aria-label="Предыдущий месяц">‹</button><span>${escapeHtml(monthLabel)}</span><button type="button" data-month-step="1" aria-label="Следующий месяц">›</button></div><div class="calendar-grid">${['Пн','Вт','Ср','Чт','Пт','Сб','Вс'].map((day) => `<span class="calendar-weekday">${day}</span>`).join('')}${buttons.join('')}</div>`;
      el('calendar').querySelectorAll('[data-month-step]').forEach((button) => button.addEventListener('click', () => {
        const next = new Date(year, month - 1 + Number(button.dataset.monthStep), 1);
        state.calendarMonth = `${next.getFullYear()}-${String(next.getMonth() + 1).padStart(2, '0')}`;
        renderCalendar();
      }));
      el('calendar').querySelectorAll('[data-calendar-date]').forEach((button) => button.addEventListener('click', () => {
        el('date').value = button.dataset.calendarDate;
        state.calendarMonth = el('date').value.slice(0, 7);
        updateDateButton();
        closeCalendar();
        el('date').dispatchEvent(new Event('change', { bubbles: true }));
      }));
    }

    function toClientNumber(value) {
      if (typeof value === 'number') return Number.isFinite(value) ? value : 0;
      const normalized = String(value || '').replace(/\s/g, '').replace(',', '.').replace(/[^0-9.-]/g, '');
      const number = Number(normalized);
      return Number.isFinite(number) ? number : 0;
    }

    function sameText(left, right) {
      return String(left || '').trim().toLocaleLowerCase('ru-RU') === String(right || '').trim().toLocaleLowerCase('ru-RU');
    }

    function key(supplier, product) { return `${supplier}::${product}`; }

    function disablePageZoom() {
      document.addEventListener('gesturestart', preventZoom, { passive: false });
      document.addEventListener('gesturechange', preventZoom, { passive: false });
      document.addEventListener('touchmove', (event) => {
        if (event.touches.length > 1) preventZoom(event);
      }, { passive: false });
    }

    function preventZoom(event) {
      event.preventDefault();
    }

    function linkPhones(text) {
      const phonePattern = /(?:\+?\d[\d\s().-]{8,}\d)/g;
      let result = '';
      let lastIndex = 0;
      String(text || '').replace(phonePattern, (phone, offset) => {
        result += escapeHtml(String(text).slice(lastIndex, offset));
        const digits = phone.replace(/\D/g, '');
        const href = digits.length === 11 && digits.startsWith('8') ? `7${digits.slice(1)}` : digits;
        result += `<a href="tel:+${href}">${escapeHtml(phone)}</a>`;
        lastIndex = offset + phone.length;
        return phone;
      });
      result += escapeHtml(String(text || '').slice(lastIndex));
      return result;
    }

    function escapeHtml(value) {
      return String(value || '').replace(/[&<>"]/g, (char) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[char]));
    }

    function escapeAttr(value) { return escapeHtml(value).replace(/'/g, '&#039;'); }

    function showLoadError(error) {
      el('loading').classList.add('hidden');
      el('loadError').classList.remove('hidden');
      el('loadError').textContent = error.message || String(error);
    }
  </script>
</body>
