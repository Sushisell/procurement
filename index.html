<!doctype html>
<html lang="ru">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <style>
    :root {
      --bg: #f5f7fb;
      --card: #ffffff;
      --text: #172033;
      --muted: #667085;
      --primary: #1570ef;
      --primary-dark: #175cd3;
      --border: #d0d5dd;
      --success: #039855;
      --danger: #d92d20;
      --shadow: 0 12px 28px rgba(16, 24, 40, .10);
      --product-header-top: 0px;
      --product-name-size: 18px;
      --product-meta-size: 16px;
    }

    * { box-sizing: border-box; }

    html {
      min-height: 100%;
      touch-action: manipulation;
      -webkit-text-size-adjust: 100%;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      font-size: 16px;
    }

    .app {
      min-height: 100vh;
      padding: 14px 14px calc(96px + env(safe-area-inset-bottom));
      max-width: 820px;
      margin: 0 auto;
    }

    .header {
      position: relative;
      padding: 12px 86px 10px 0;
      background: linear-gradient(180deg, var(--bg) 80%, rgba(245, 247, 251, 0));
    }

    .version-badge {
      position: fixed;
      top: calc(10px + env(safe-area-inset-top));
      right: 12px;
      z-index: 40;
      padding: 6px 10px;
      border: 1px solid rgba(208, 213, 221, .9);
      border-radius: 999px;
      background: rgba(255, 255, 255, .92);
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
      box-shadow: 0 8px 20px rgba(16, 24, 40, .10);
      backdrop-filter: blur(10px);
    }

    .title {
      margin: 0 0 6px;
      font-size: 24px;
      line-height: 1.15;
      font-weight: 800;
    }

    .subtitle { margin: 0; color: var(--muted); font-size: 14px; }

    .card {
      background: var(--card);
      border: 1px solid rgba(208, 213, 221, .8);
      border-radius: 18px;
      padding: 10px;
      margin: 8px 0;
      box-shadow: var(--shadow);
    }

    .setup-grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      gap: 8px;
      align-items: end;
    }

    label {
      display: block;
      margin: 0 0 4px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
      line-height: 1.1;
      text-transform: uppercase;
      letter-spacing: .03em;
    }

    select, input[type="date"], input[type="number"], input[type="search"] {
      width: 100%;
      min-height: 42px;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 8px 10px;
      font: inherit;
      font-size: max(16px, 1em);
      background: #fff;
    }

    .supplier-card {
      border-radius: 18px;
      border: 1px solid var(--border);
      padding: 14px;
      background: #fff;
      margin: 10px 0 14px;
    }

    .supplier-top {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
    }

    .supplier-name { font-size: 20px; font-weight: 800; margin: 0; }
    .supplier-summary {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .summary-cloud {
      min-height: 68px;
      padding: 11px 12px;
      border-radius: 18px;
      background: #eff8ff;
      color: #1849a9;
      font-weight: 800;
    }

    .summary-cloud.total {
      background: #ecfdf3;
      color: #027a48;
    }

    .summary-label {
      display: block;
      margin-bottom: 5px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.1;
      text-transform: uppercase;
      letter-spacing: .03em;
    }

    .summary-value {
      display: block;
      font-size: 17px;
      line-height: 1.2;
    }

    .meta { color: var(--muted); font-size: 14px; margin-top: 8px; white-space: pre-line; }
    .phones a { color: var(--primary-dark); font-weight: 700; text-decoration: none; }

    .product-table {
      margin-top: 10px;
      border: 1px solid #eaecf0;
      border-radius: 16px;
      overflow: visible;
      background: #fff;
    }

    .product-sticky-head {
      position: sticky;
      top: var(--product-header-top);
      z-index: 14;
      overflow: hidden;
      border-radius: 16px 16px 0 0;
      background: #eef4ff;
      box-shadow: 0 8px 18px rgba(16, 24, 40, .12);
    }

    .product-sums {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 8px;
      padding: 8px 10px;
      color: #1849a9;
      border-bottom: 1px solid #b2ccff;
    }

    .product-sum-label {
      display: block;
      color: var(--muted);
      font-size: 11px;
      font-weight: 900;
      line-height: 1.1;
      text-transform: uppercase;
      letter-spacing: .03em;
    }

    .product-sum-value {
      display: block;
      margin-top: 2px;
      font-size: 15px;
      font-weight: 900;
      line-height: 1.15;
    }

    .product-sum-value.total { color: var(--success); }

    .product-row {
      display: grid;
      grid-template-columns: minmax(150px, 1fr) 92px 92px 104px;
      gap: 10px;
      align-items: center;
      padding: 13px 12px;
      border-top: 1px solid #eaecf0;
    }

    .product-row:first-child { border-top: 0; }

    .product-header {
      background: #eef4ff;
      color: #1849a9;
      font-size: 12px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: .03em;
      border-top: 0;
      border-bottom: 1px solid #b2ccff;
    }

    .product-name { font-weight: 800; font-size: var(--product-name-size); line-height: 1.22; }
    .product-price, .product-unit { color: var(--muted); font-size: var(--product-meta-size); }
    .line-total { margin-top: 5px; color: var(--success); font-size: 15px; font-weight: 800; }
    .qty { text-align: center; font-weight: 800; font-size: 18px !important; }

    @media (max-width: 760px) {
      :root {
        --product-header-top: 122px;
        --product-name-size: 17px;
        --product-meta-size: 15px;
      }

      body { font-size: 18px; }

      .app {
        max-width: none;
        padding: 14px 10px calc(112px + env(safe-area-inset-bottom));
      }

      .title { font-size: 24px; }
      .subtitle, .meta { font-size: 15px; }
      .version-badge { font-size: 13px; }

      .header { padding-bottom: 6px; }

      .setup-grid {
        grid-template-columns: 1fr 1fr;
      }

      .setup-field.date-field input { min-height: 46px; }
      .supplier-name { font-size: 23px; }
      .summary-label, .product-header { font-size: 13px; }
      .summary-value { font-size: 19px; }
      .line-total { font-size: 15px; }
      .total-label { font-size: 15px; }
      .total-value { font-size: 23px; }

      .product-table {
        overflow: visible;
      }

      .product-row {
        grid-template-columns: minmax(0, 1fr) 58px 74px 88px;
        gap: 6px;
        padding: 14px 10px;
      }
    }

    @media (max-width: 420px) {
      :root {
        --product-name-size: 16px;
        --product-meta-size: 14px;
      }

      .app { padding-left: 8px; padding-right: 8px; }
      .card, .supplier-card { border-radius: 16px; }
      .product-row { grid-template-columns: minmax(0, 1fr) 52px 64px 80px; }
      .product-header { font-size: 11px; }
    }

    .bottom-bar {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 30;
      padding: 10px 14px calc(10px + env(safe-area-inset-bottom));
      background: rgba(255, 255, 255, .96);
      border-top: 1px solid var(--border);
      backdrop-filter: blur(12px);
    }

    .bottom-inner {
      max-width: 820px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 1fr 1.2fr;
      gap: 10px;
      align-items: center;
    }

    .total-label { color: var(--muted); font-size: 13px; }
    .total-value { font-size: 20px; font-weight: 900; }

    button.primary {
      min-height: 52px;
      border: 0;
      border-radius: 16px;
      background: var(--primary);
      color: #fff;
      font: inherit;
      font-weight: 900;
    }

    button.primary:disabled { opacity: .55; }
    .hidden { display: none !important; }
    .empty, .error { padding: 20px; text-align: center; color: var(--muted); }
    .error { color: var(--danger); }
    .toast { margin-top: 10px; font-size: 14px; color: var(--muted); }

    /* Compact mobile ordering layout */
    .supplier-card { padding: 10px 12px; box-shadow: var(--shadow); }
    .supplier-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .supplier-name { font-size: 16px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .supplier-inline { font-size: 13px; font-weight: 800; white-space: nowrap; }
    .supplier-inline.ok { color: var(--success); }
    .supplier-inline.short { color: var(--danger); }
    .supplier-controls { display: flex; gap: 8px; align-items: end; margin-top: 8px; }
    .supplier-controls input { min-height: 38px; padding: 6px 8px; }
    .conditions { border: 0; background: #eef4ff; color: #1849a9; border-radius: 10px; min-height: 38px; padding: 0 10px; font-weight: 800; }
    .search-tools { display: grid; grid-template-columns: 1fr auto; gap: 8px; margin: 8px 0; }
    .filter-button { border: 1px solid var(--border); border-radius: 12px; background: white; padding: 0 12px; font-weight: 750; }
    .filter-button.active { background: #eef4ff; color: #1849a9; border-color: #84adff; }
    .product-table { overflow: visible; margin-top: 0; }
    .product-row { display: grid; grid-template-columns: minmax(0, 1fr) 60px 98px; align-items: center; gap: 6px; min-height: 50px; padding: 7px 8px; transition: background .15s ease; }
    .product-row.selected { background: #ecfdf3; }
    .product-main { min-width: 0; }
    .product-name { min-width: 0; overflow-wrap: anywhere; white-space: normal; font-size: 14px; }
    .product-price, .product-unit { color: var(--muted); font-size: 12px; text-align: right; font-variant-numeric: tabular-nums; }
    .quantity-control { display: flex; min-width: 0; flex-direction: column; align-items: center; gap: 4px; }
    .quantity-control .product-price { color: var(--danger); text-align: center; white-space: nowrap; }
    .product-header span { min-width: 0; text-align: right; white-space: normal; overflow-wrap: normal; }
    .product-header span:first-child { text-align: left; }
    .availability-notice { margin: 10px 0; padding: 16px; border: 1px solid #fda29b; border-radius: 16px; background: #fef3f2; color: #b42318; font-size: 15px; line-height: 1.45; }
    .availability-notice strong { display: block; margin-bottom: 5px; }
    .stepper { display: grid; grid-template-columns: 34px 30px 34px; align-items: center; }
    .stepper button { width: 34px; height: 34px; border: 1px solid var(--border); background: #fff; color: var(--primary-dark); font-size: 22px; font-weight: 800; line-height: 1; }
    .stepper button:first-child { border-radius: 10px 0 0 10px; }
    .stepper button:last-child { border-radius: 0 10px 10px 0; }
    .qty-value { text-align: center; font-weight: 850; font-variant-numeric: tabular-nums; }
    .setup-grid { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
    .setup-grid select { min-width: 0; padding-left: 7px; padding-right: 4px; font-size: 14px; }
    .setup-field label { font-size: 10px; }
    .mode-switch { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; margin: 4px 0 10px; padding: 4px; border-radius: 14px; background: #e4e7ec; }
    .mode-button { min-height: 42px; border: 0; border-radius: 11px; background: transparent; color: var(--muted); font: inherit; font-weight: 850; }
    .mode-button.active { background: #fff; color: var(--primary-dark); box-shadow: 0 2px 8px rgba(16, 24, 40, .12); }
    .receipt-head { display: flex; justify-content: space-between; gap: 10px; align-items: start; }
    .receipt-title { margin: 0; font-size: 19px; }
    .receipt-meta { margin-top: 5px; color: var(--muted); font-size: 14px; }
    .refresh-button { border: 1px solid var(--border); border-radius: 11px; background: #fff; padding: 8px 10px; color: var(--primary-dark); font-weight: 800; }
    .receipt-row { padding: 12px 0; border-top: 1px solid #eaecf0; }
    .receipt-row:first-child { border-top: 0; }
    .receipt-ordered { margin-bottom: 8px; font-weight: 800; }
    .receipt-fields { display: grid; grid-template-columns: minmax(0, 1fr) 100px; gap: 8px; }
    .receipt-fields label { text-transform: none; letter-spacing: 0; }
    .receipt-fields input { min-height: 44px; }
    .receipt-fields input:not([type="number"]) { width: 100%; border: 1px solid var(--border); border-radius: 12px; padding: 8px 10px; font: inherit; }
    .received-note { margin: 10px 0 0; padding: 10px 12px; border-radius: 12px; background: #ecfdf3; color: #027a48; font-weight: 750; }
    .receipt-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
    .secondary-action { min-height: 44px; border: 1px solid var(--primary); border-radius: 12px; background: #fff; color: var(--primary-dark); font-weight: 850; }
    .edit-stepper { display: grid; grid-template-columns: 40px 1fr 40px; align-items: center; max-width: 180px; }
    .edit-stepper button { height: 40px; border: 1px solid var(--border); background: #fff; color: var(--primary-dark); font-size: 22px; }
    .edit-stepper output { text-align: center; font-weight: 850; }
    @media (min-width: 560px) { .product-name { font-size: 15px; } }
    @media (max-width: 420px) {
      .product-row { grid-template-columns: minmax(0, 1fr) 52px 92px; gap: 4px; }
      .product-header { font-size: 9px; letter-spacing: 0; }
    }
  </style>
</head>
<body>
  <div id="appVersion" class="version-badge">v0.7.0</div>
  <main class="app">
    <header class="header">
      <h1 class="title">Заявка на продукты</h1>
      <p id="subtitle" class="subtitle">Выберите филиал, ФИО, дату и поставщика.</p>
    </header>

    <nav class="mode-switch" aria-label="Раздел">
      <button id="orderMode" class="mode-button active" type="button">Новая заявка</button>
      <button id="receiptMode" class="mode-button" type="button">Приёмка</button>
    </nav>

    <section id="setup" class="card">
      <div id="loading">Загружаю справочники…</div>
      <div id="setupFields" class="setup-grid hidden">
        <div class="setup-field">
          <label for="branch">Филиал</label>
          <select id="branch"></select>
        </div>

        <div class="setup-field">
          <label for="employee">ФИО</label>
          <select id="employee"></select>
        </div>

        <div class="setup-field date-field">
          <label for="date">Дата поставки (Красноярск)</label>
          <input id="date" type="date">
        </div>

        <div class="setup-field supplier-field">
          <label for="supplier">Поставщик</label>
          <select id="supplier"></select>
        </div>
      </div>
      <div id="loadError" class="error hidden"></div>
    </section>

    <section id="order" class="hidden">
      <div class="search-tools"><input id="search" type="search" placeholder="Найти товар"><button id="selectedOnly" class="filter-button" type="button">Выбранные</button></div>
      <div id="supplierPanel"></div>
    </section>
    <section id="receipt" class="hidden">
      <div id="receiptPanel" class="card"><div class="empty">Выберите филиал, чтобы загрузить последнюю заявку.</div></div>
    </section>
  </main>

  <footer class="bottom-bar">
    <div class="bottom-inner">
      <div>
        <div id="footerLabel" class="total-label">Общая сумма</div>
        <div id="grandTotal" class="total-value">—</div>
      </div>
      <button id="submit" class="primary" disabled>Отправить</button>
    </div>
    <div id="status" class="toast"></div>
  </footer>

  <script>
    const APP_VERSION = 'v0.7.0';
    const DEFAULT_API_URL = 'https://script.google.com/macros/s/AKfycbzH9AQ4EGl_EjaxR8Ii7jfHxx2lXdjMCfgOesNH9DVE_MI_u32yy_h0ttrJB-JmG_hmRg/exec';
    const API_URL = window.PROCUREMENT_API_URL || new URLSearchParams(window.location.search).get('api') || DEFAULT_API_URL;
    const hasAppsScriptBridge = Boolean(window.google?.script?.run);

    const state = {
      data: null,
      activeSupplier: '',
      quantities: {},
      submitting: false,
      selectedOnly: false,
      mode: 'order',
      latestOrder: null,
      receiptOrders: [],
      loadingReceipt: false,
    };

    const el = (id) => document.getElementById(id);
    const money = (value) => new Intl.NumberFormat('ru-RU', { style: 'currency', currency: 'RUB', maximumFractionDigits: 0 }).format(value || 0);

    disablePageZoom();

    loadBootstrapData();

    function init(data) {
      state.data = data;
      el('loading').classList.add('hidden');
      el('setupFields').classList.remove('hidden');
      el('order').classList.remove('hidden');
      el('date').value = data.today;
      el('date').min = data.today;
      el('appVersion').textContent = APP_VERSION;

      renderBranches();
      renderEmployees();
      renderSupplierOptions();
      renderSupplier();
      bindEvents();
      updateStickyHeaderOffset();
      updateTotals();
    }

    function bindEvents() {
      el('branch').addEventListener('change', () => {
        renderEmployees();
        if (state.mode === 'receipt') loadLatestOrder();
        updateSubmitState();
      });
      el('employee').addEventListener('change', updateSubmitState);
      el('date').addEventListener('change', () => {
        if (state.mode === 'receipt') {
          loadLatestOrder();
          return;
        }
        renderSupplierOptions();
        renderSupplier();
        updateTotals();
      });
      el('supplier').addEventListener('change', () => {
        state.activeSupplier = el('supplier').value;
        renderSupplier();
        updateTotals();
      });
      el('search').addEventListener('input', renderSupplier);
      el('selectedOnly').addEventListener('click', () => { state.selectedOnly = !state.selectedOnly; el('selectedOnly').classList.toggle('active', state.selectedOnly); renderSupplier(); });
      window.addEventListener('resize', updateStickyHeaderOffset);
      window.addEventListener('orientationchange', updateStickyHeaderOffset);
      el('submit').addEventListener('click', submitOrder);
      el('orderMode').addEventListener('click', () => setMode('order'));
      el('receiptMode').addEventListener('click', () => setMode('receipt'));
    }

    function renderBranches() {
      const options = ['<option value="">Выберите филиал</option>']
        .concat(state.data.branches.map((branch) => `<option>${escapeHtml(branch.name)}</option>`));
      el('branch').innerHTML = options.join('');
    }

    function renderEmployees() {
      const branch = el('branch').value;
      const employees = state.data.employeesByBranch[branch] || [];
      const options = ['<option value="">Выберите ФИО</option>']
        .concat(employees.map((name) => `<option>${escapeHtml(name)}</option>`));
      el('employee').innerHTML = options.join('');
    }

    function renderSupplierOptions() {
      const date = el('date').value;
      const availableGroups = state.data.catalog.filter((group) => {
        const info = state.data.suppliers[group.supplier] || {};
        return date && !isDateUnavailable(info, date);
      });
      if (!availableGroups.some((group) => group.supplier === state.activeSupplier)) {
        state.activeSupplier = availableGroups[0]?.supplier || '';
      }
      el('supplier').innerHTML = availableGroups.length
        ? availableGroups.map((group) => `<option value="${escapeAttr(group.supplier)}"${group.supplier === state.activeSupplier ? ' selected' : ''}>${escapeHtml(group.supplier)}</option>`).join('')
        : '<option value="">Нет доступных поставщиков</option>';
      el('supplier').disabled = !availableGroups.length;
    }

    function renderSupplier() {
      const group = state.data.catalog.find((item) => item.supplier === state.activeSupplier);
      if (!group) {
        el('supplierPanel').innerHTML = '<div class="empty">Нет товаров</div>';
        return;
      }

      const info = state.data.suppliers[group.supplier] || {};
      const query = el('search').value.trim().toLowerCase();
      const products = group.products.filter((item) => item.product.toLowerCase().includes(query) && (!state.selectedOnly || getQuantity(group.supplier, item.product) > 0));
      const supplierTotal = getSupplierTotal(group);
      const progress = getMinimumProgress(group, info);
      const minimum = progress.minimum;
      const missing = Math.max(0, minimum - progress.current);
      const minimumLabel = formatMinimum(info);
      const unavailable = isSelectedDateUnavailable(info);
      const cutoffText = info.deliveryRules?.length
        ? ''
        : (info.cutoffTime
          ? `На сегодня до ${escapeHtml(info.cutoffTime)} по Красноярску`
          : 'График приёма заявок не указан');
      el('supplierPanel').innerHTML = `
        <div class="supplier-card">
          <div class="supplier-top">
            <h2 class="supplier-name">${escapeHtml(group.supplier)}</h2>
            <div class="supplier-inline ${missing ? 'short' : 'ok'}">Заявка ${money(supplierTotal)} · Мин. ${escapeHtml(minimumLabel)} ${minimum && !missing ? '✓' : ''}</div>
          </div>
          <div class="supplier-controls"><button class="conditions" id="conditionsButton" type="button">Условия ⓘ</button></div>
          ${cutoffText ? `<div class="meta">${cutoffText}</div>` : ''}
          ${missing && !unavailable ? `<div class="meta" style="color:var(--danger)">До минималки не хватает ${escapeHtml(formatMinimumValue(missing, info))}</div>` : ''}
          <div id="conditionsText" class="meta hidden">${escapeHtml(info.orderInfo || 'Условия не указаны')} ${info.contact ? `<br>${linkPhones(info.contact)}` : ''}</div>
        </div>
        ${unavailable ? renderUnavailableNotice(info) : renderProductTable(group.supplier, products, info, supplierTotal)}
      `;
      el('conditionsButton').addEventListener('click', () => el('conditionsText').classList.toggle('hidden'));

      el('supplierPanel').querySelectorAll('[data-step]').forEach((button) => {
        button.addEventListener('click', () => {
          const { supplier, product, step } = button.dataset;
          state.quantities[key(supplier, product)] = Math.max(0, getQuantity(supplier, product) + Number(step));
          renderSupplier();
          updateTotals();
        });
      });
    }

    function renderProductTable(supplier, products, info, supplierTotal) {
      if (!products.length) return '<div class="empty">По поиску ничего не найдено</div>';
      return `<div class="product-table" role="table">
        <div class="product-sticky-head">
          <div class="product-sums"><strong>${escapeHtml(supplier)}</strong><strong class="${getMinimumProgress(state.data.catalog.find((group) => group.supplier === supplier), info).missing ? 'short' : 'ok'}">${money(supplierTotal)} / мин. ${escapeHtml(formatMinimum(info))}</strong></div>
          <div class="product-row product-header" role="row"><span>Наименование</span><span>Кратн.</span><span>Кол-во</span></div>
        </div>
        ${products.map((item) => renderProduct(supplier, item)).join('')}</div>`;
    }

    function renderProduct(supplier, item) {
      const quantity = getQuantity(supplier, item.product);
      const price = priceForDate(item, el('date').value);
      return `
        <div class="product-row ${quantity ? 'selected' : ''}" role="row">
          <div class="product-main">
            <span class="product-name">${escapeHtml(item.product)}</span>
          </div>
          <div class="product-unit">${escapeHtml(item.unit || '1')}</div>
          <div class="quantity-control">
            <div class="stepper" aria-label="Количество">
              <button type="button" data-step="-1" data-supplier="${escapeAttr(supplier)}" data-product="${escapeAttr(item.product)}" aria-label="Уменьшить">−</button>
              <span class="qty-value">${quantity}</span>
              <button type="button" data-step="1" data-supplier="${escapeAttr(supplier)}" data-product="${escapeAttr(item.product)}" aria-label="Увеличить">+</button>
            </div>
            <div class="product-price">по ${money(price)}</div>
          </div>
        </div>`;
    }

    function submitOrder() {
      if (state.mode === 'receipt') return submitReceipt();
      if (state.submitting) return;
      state.submitting = true;
      updateSubmitState();
      el('status').textContent = 'Отправляю заявку…';

      const payload = {
        branch: el('branch').value,
        employee: el('employee').value,
        date: el('date').value,
        supplier: state.activeSupplier,
        items: collectItems().filter((item) => item.supplier === state.activeSupplier),
      };

      runServer('submitOrder', payload)
        .then((result) => {
          state.submitting = false;
          el('status').textContent = `Готово. Сумма: ${money(result.total)}${result.warnings?.length ? ' · Есть предупреждения' : ''}`;
          updateSubmitState();
        })
        .catch((error) => {
          state.submitting = false;
          el('status').textContent = error.message || String(error);
          updateSubmitState();
        });
    }

    function setMode(mode) {
      state.mode = mode;
      const receiving = mode === 'receipt';
      el('orderMode').classList.toggle('active', !receiving);
      el('receiptMode').classList.toggle('active', receiving);
      el('order').classList.toggle('hidden', receiving);
      el('receipt').classList.toggle('hidden', !receiving);
      el('date').closest('.setup-field').classList.remove('hidden');
      el('supplier').closest('.setup-field').classList.toggle('hidden', receiving);
      el('date').min = receiving ? '' : state.data.today;
      el('date').closest('.setup-field').querySelector('label').textContent = receiving
        ? 'День получения'
        : 'Дата поставки (Красноярск)';
      el('subtitle').textContent = receiving
        ? 'Выберите филиал и своё ФИО, затем отметьте фактическую поставку.'
        : 'Выберите филиал, ФИО, дату и поставщика.';
      el('footerLabel').textContent = receiving ? 'Выбранная заявка' : 'Общая сумма';
      if (receiving) loadLatestOrder();
      else updateTotals();
      updateSubmitState();
    }

    function loadLatestOrder() {
      const branch = el('branch').value;
      state.latestOrder = null;
      state.receiptOrders = [];
      if (!branch) {
        renderReceipt();
        updateSubmitState();
        return;
      }
      state.loadingReceipt = true;
      el('receiptPanel').innerHTML = '<div class="empty">Загружаю последнюю заявку…</div>';
      runServer('getOrders', { branch, date: el('date').value })
        .then((orders) => {
          state.loadingReceipt = false;
          state.receiptOrders = orders || [];
          state.latestOrder = state.receiptOrders[0] || null;
          renderReceipt();
          updateSubmitState();
        })
        .catch((error) => {
          state.loadingReceipt = false;
          el('receiptPanel').innerHTML = `<div class="error">${escapeHtml(error.message || String(error))}</div>`;
          updateSubmitState();
        });
    }

    function renderReceipt() {
      const order = state.latestOrder;
      if (!el('branch').value) {
        el('receiptPanel').innerHTML = '<div class="empty">Выберите филиал, чтобы загрузить последнюю заявку.</div>';
        el('grandTotal').textContent = '—';
        return;
      }
      if (!order) {
        el('receiptPanel').innerHTML = '<div class="empty">У филиала пока нет отправленных заявок.</div>';
        el('grandTotal').textContent = 'Нет заявок';
        return;
      }
      const receiptItems = Object.fromEntries((order.receipt?.items || []).map((item) => [item.orderedProduct, item]));
      const formattedDate = new Intl.DateTimeFormat('ru-RU', { day: 'numeric', month: 'long', year: 'numeric' })
        .format(new Date(`${order.date}T00:00:00`));
      el('receiptPanel').innerHTML = `
        <div class="setup-field" style="margin-bottom:12px">
          <label for="receiptSupplier">Поставщик</label>
          <select id="receiptSupplier">${state.receiptOrders.map((item) => `<option value="${escapeAttr(item.id)}"${item.id === order.id ? ' selected' : ''}>${escapeHtml(item.supplier)}</option>`).join('')}</select>
        </div>
        <div class="receipt-head">
          <div><h2 class="receipt-title">${escapeHtml(order.supplier || 'Последняя заявка')}</h2>
          <div class="receipt-meta">Поставка ${escapeHtml(formattedDate)} · заказ оформил(а) ${escapeHtml(order.initiator)}</div></div>
          <button id="refreshReceipt" class="refresh-button" type="button">Обновить</button>
        </div>
        <div class="received-note">Статус: ${order.status === 'ordered'
          ? 'заказано — отмечайте поступления'
          : order.editable === false
            ? 'отправлено — время изменения заявки прошло'
            : 'отправлено — заявку можно корректировать'}</div>
        <div style="margin-top:12px">${order.items.filter((item) => {
          const saved = receiptItems[item.product];
          return order.status !== 'ordered' || !saved || saved.actualQuantity < item.quantity;
        }).map((item, index) => {
          const saved = receiptItems[item.product] || {};
          if (order.status !== 'ordered') return `<div class="receipt-row">
            <div class="receipt-ordered">${escapeHtml(item.product)}</div>
            <div class="edit-stepper" data-edit-product="${escapeAttr(item.product)}">
              <button type="button" data-edit-step="-1"${order.editable === false ? ' disabled' : ''}>−</button><output>${item.quantity}</output><button type="button" data-edit-step="1"${order.editable === false ? ' disabled' : ''}>+</button>
            </div>
          </div>`;
          const remaining = Math.max(0, item.quantity - (saved.actualQuantity || 0));
          return `<div class="receipt-row">
            <div class="receipt-ordered">${escapeHtml(item.product)} — осталось ${remaining} ${escapeHtml(item.unit || '')}</div>
            <div class="receipt-fields">
              <div><label for="actualProduct${index}">Что приехало</label><input id="actualProduct${index}" data-actual-product data-ordered-product="${escapeAttr(item.product)}" value="${escapeAttr(saved.actualProduct || item.product)}"></div>
              <div><label for="actualQuantity${index}">Сейчас</label><input id="actualQuantity${index}" data-actual-quantity type="number" min="0" max="${remaining}" step="any" value="0"></div>
            </div>
          </div>`;
        }).join('') || '<div class="empty">Все позиции получены полностью.</div>'}</div>
        ${order.status === 'submitted' && order.editable !== false ? '<div class="receipt-actions"><button id="saveCorrection" class="secondary-action" type="button">Сохранить изменения</button><button id="markOrdered" class="secondary-action" type="button">Заявка заказана</button></div>' : ''}`;
      el('refreshReceipt').addEventListener('click', loadLatestOrder);
      el('receiptSupplier').addEventListener('change', (event) => {
        state.latestOrder = state.receiptOrders.find((item) => item.id === event.target.value) || null;
        renderReceipt();
        updateSubmitState();
      });
      el('receiptPanel').querySelectorAll('[data-edit-step]').forEach((button) => button.addEventListener('click', () => {
        const output = button.parentElement.querySelector('output');
        output.value = Math.max(0, toClientNumber(output.value) + Number(button.dataset.editStep));
        output.textContent = output.value;
      }));
      el('saveCorrection')?.addEventListener('click', saveOrderCorrection);
      el('markOrdered')?.addEventListener('click', markOrderOrdered);
      el('receiptPanel').querySelectorAll('input').forEach((input) => input.addEventListener('input', updateSubmitState));
      el('grandTotal').textContent = `${order.items.length} поз.`;
    }

    function submitReceipt() {
      if (state.submitting || !state.latestOrder) return;
      state.submitting = true;
      updateSubmitState();
      el('status').textContent = 'Сохраняю приёмку…';
      const products = Array.from(el('receiptPanel').querySelectorAll('[data-actual-product]'));
      const quantities = Array.from(el('receiptPanel').querySelectorAll('[data-actual-quantity]'));
      const items = products.map((input, index) => ({
        orderedProduct: input.dataset.orderedProduct,
        actualProduct: input.value.trim(),
        actualQuantity: toClientNumber(quantities[index].value),
      }));
      runServer('receiveOrder', {
        branch: el('branch').value,
        employee: el('employee').value,
        orderId: state.latestOrder.id,
        items,
      }).then(() => {
        state.submitting = false;
        el('status').textContent = 'Приёмка сохранена.';
        loadLatestOrder();
      }).catch((error) => {
        state.submitting = false;
        el('status').textContent = error.message || String(error);
        updateSubmitState();
      });
    }

    function saveOrderCorrection() {
      const items = Array.from(el('receiptPanel').querySelectorAll('[data-edit-product]')).map((node) => ({
        product: node.dataset.editProduct,
        quantity: toClientNumber(node.querySelector('output').value),
      }));
      runServer('updateSubmittedOrder', { branch: el('branch').value, orderId: state.latestOrder.id, items })
        .then(() => { el('status').textContent = 'Изменения сохранены.'; loadLatestOrder(); })
        .catch((error) => { el('status').textContent = error.message || String(error); });
    }

    function markOrderOrdered() {
      runServer('markOrderOrdered', { branch: el('branch').value, orderId: state.latestOrder.id })
        .then(() => { el('status').textContent = 'Заявка отмечена как заказанная.'; loadLatestOrder(); })
        .catch((error) => { el('status').textContent = error.message || String(error); });
    }

    function loadBootstrapData() {
      runServer('getBootstrapData')
        .then(init)
        .catch(showLoadError);
    }

    function runServer(method, payload) {
      if (hasAppsScriptBridge) return runAppsScript(method, payload);
      if (!API_URL) {
        return Promise.reject(new Error('Для GitHub Pages укажите URL веб-приложения Apps Script: ?api=https://script.google.com/macros/s/.../exec или window.PROCUREMENT_API_URL.'));
      }
      return runHttpApi(method, payload);
    }

    function runAppsScript(method, payload) {
      return new Promise((resolve, reject) => {
        const runner = google.script.run.withSuccessHandler(resolve).withFailureHandler(reject);
        if (payload === undefined) runner[method]();
        else runner[method](payload);
      });
    }

    function runHttpApi(method, payload) {
      const url = new URL(API_URL);
      const actions = { getBootstrapData: 'bootstrap', submitOrder: 'submit', getLatestOrder: 'latestOrder', getOrders: 'orders', receiveOrder: 'receive', updateSubmittedOrder: 'updateOrder', markOrderOrdered: 'markOrdered' };
      url.searchParams.set('action', actions[method] || method);
      const options = method === 'getBootstrapData'
        ? { method: 'GET' }
        : {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(payload),
        };

      return fetch(url.toString(), options)
        .then((response) => response.json())
        .then((result) => {
          if (!result.ok) throw new Error(result.error || 'Ошибка API');
          return result.data;
        });
    }

    function collectItems() {
      const items = [];
      state.data.catalog.forEach((group) => {
        group.products.forEach((item) => {
          const quantity = getQuantity(group.supplier, item.product);
          if (!quantity) return;
          items.push({
            supplier: group.supplier,
            product: item.product,
            price: priceForDate(item, el('date').value),
            unit: item.unit,
            quantity,
          });
        });
      });
      return items;
    }

    function updateTotals() {
      el('grandTotal').textContent = '—';
      updateVisibleSupplierSums();
      updateSubmitState();
    }

    function updateSubmitState() {
      if (state.mode === 'receipt') {
        if (state.latestOrder?.status === 'submitted') {
          el('submit').disabled = true;
          el('submit').textContent = state.latestOrder.editable === false ? 'Время заявки прошло' : 'Сначала отметьте «заказана»';
          return;
        }
        const hasActualItems = Boolean(state.latestOrder) && Array.from(el('receiptPanel').querySelectorAll('[data-actual-product]'))
          .every((input) => input.value.trim()) && Array.from(el('receiptPanel').querySelectorAll('[data-actual-quantity]'))
          .some((input) => toClientNumber(input.value) > 0);
        el('submit').disabled = state.submitting || state.loadingReceipt || !el('branch').value || !el('employee').value || !hasActualItems;
        el('submit').textContent = state.submitting ? 'Сохранение…' : 'Сохранить приёмку';
        return;
      }
      const group = state.data.catalog.find((item) => item.supplier === state.activeSupplier);
      const info = state.data.suppliers[state.activeSupplier] || {};
      const currentItems = collectItems().filter((item) => item.supplier === state.activeSupplier);
      const progress = getMinimumProgress(group, info);
      const meetsMinimum = !progress.minimum || !progress.missing;
      el('submit').disabled = state.submitting || !el('branch').value || !el('employee').value || !el('date').value || isSelectedDateUnavailable(info) || !currentItems.length || !meetsMinimum;
      el('submit').textContent = state.submitting ? 'Отправка…' : 'Отправить';
    }

    function priceForDate(item, date) {
      const available = (item.prices || []).filter((entry) => !entry.effectiveDate || entry.effectiveDate <= date);
      return toClientNumber(available.length ? available[available.length - 1].price : item.price);
    }

    function minimumNumber(value) { return toClientNumber(String(value || '').replace(/р\.?/gi, '')); }

    function minimumUnit(info) {
      const unit = String(info.unit || '').trim();
      if (/кг/i.test(unit)) return 'кг';
      if (/(?:шт|штук)/i.test(unit)) return 'шт';
      return '₽';
    }

    function formatMinimum(info) {
      if (!info.minimum) return '—';
      const raw = String(info.minimum).trim();
      return /(?:₽|руб|р\.|кг|шт)/i.test(raw) ? raw : `${raw} ${minimumUnit(info)}`;
    }

    function formatMinimumValue(value, info) {
      return minimumUnit(info) === '₽' ? money(value) : `${new Intl.NumberFormat('ru-RU', { maximumFractionDigits: 2 }).format(value)} ${minimumUnit(info)}`;
    }

    function getMinimumProgress(group, info) {
      const minimum = minimumNumber(info.minimum);
      if (!group) return { minimum, current: 0, missing: minimum };
      const unit = minimumUnit(info);
      let current = getSupplierTotal(group);
      if (unit === 'шт') current = group.products.reduce((sum, item) => sum + getQuantity(group.supplier, item.product), 0);
      if (unit === 'кг') current = group.products.reduce((sum, item) => sum + getQuantity(group.supplier, item.product) * (toClientNumber(item.unit) || 1), 0);
      return { minimum, current, missing: Math.max(0, minimum - current) };
    }

    function isSelectedDateUnavailable(info) {
      const selectedDate = el('date').value;
      if (!selectedDate) return false;
      return isDateUnavailable(info, selectedDate);
    }

    function isDateUnavailable(info, selectedDate) {
      if (info.deliveryRules?.length) {
        return !(info.availableDeliveryDates || []).includes(selectedDate);
      }
      return Boolean(info.earliestDeliveryDate && selectedDate < info.earliestDeliveryDate);
    }

    function renderUnavailableNotice(info) {
      const nextDate = (info.availableDeliveryDates || []).find((date) => date >= el('date').value)
        || info.earliestDeliveryDate;
      const formattedDate = nextDate
        ? new Intl.DateTimeFormat('ru-RU', { day: 'numeric', month: 'long' }).format(new Date(`${nextDate}T00:00:00`))
        : '';
      return `<div class="availability-notice"><strong>Заявку на выбранную дату уже нельзя принять.</strong>Дата не соответствует графику поставщика или время приёма заявки уже прошло.${formattedDate ? `<br>Ближайшая доступная дата — ${escapeHtml(formattedDate)}.` : ''}</div>`;
    }

    function getQuantity(supplier, product) {
      return toClientNumber(state.quantities[key(supplier, product)]);
    }

    function getSupplierTotal(group) {
      return group.products.reduce((sum, item) => sum + getQuantity(group.supplier, item.product) * priceForDate(item, el('date').value), 0);
    }

    function updateVisibleLine(input) {
      const row = input.closest('.product-row');
      if (!row) return;
      const price = toClientNumber(row.querySelector('.product-price')?.dataset.price);
      const total = toClientNumber(input.value) * price;
      const line = row.querySelector('.line-total');
      if (!line) return;
      line.textContent = money(total);
      line.classList.toggle('hidden', !total);
    }

    function updateVisibleSupplierSums() {
      const group = state.data.catalog.find((item) => item.supplier === state.activeSupplier);
      if (!group) return;
      const total = money(getSupplierTotal(group));
      document.querySelectorAll('[data-supplier-total]').forEach((node) => {
        node.textContent = total;
      });
    }

    function updateStickyHeaderOffset() {
      document.documentElement.style.setProperty('--product-header-top', '0px');
    }

    function toClientNumber(value) {
      if (typeof value === 'number') return Number.isFinite(value) ? value : 0;
      const normalized = String(value || '').replace(/\s/g, '').replace(',', '.').replace(/[^0-9.-]/g, '');
      const number = Number(normalized);
      return Number.isFinite(number) ? number : 0;
    }

    function key(supplier, product) { return `${supplier}::${product}`; }

    function disablePageZoom() {
      document.addEventListener('gesturestart', preventZoom, { passive: false });
      document.addEventListener('gesturechange', preventZoom, { passive: false });
      document.addEventListener('touchmove', (event) => {
        if (event.touches.length > 1) preventZoom(event);
      }, { passive: false });
    }

    function preventZoom(event) {
      event.preventDefault();
    }

    function linkPhones(text) {
      const phonePattern = /(?:\+?\d[\d\s().-]{8,}\d)/g;
      let result = '';
      let lastIndex = 0;
      String(text || '').replace(phonePattern, (phone, offset) => {
        result += escapeHtml(String(text).slice(lastIndex, offset));
        const digits = phone.replace(/\D/g, '');
        const href = digits.length === 11 && digits.startsWith('8') ? `7${digits.slice(1)}` : digits;
        result += `<a href="tel:+${href}">${escapeHtml(phone)}</a>`;
        lastIndex = offset + phone.length;
        return phone;
      });
      result += escapeHtml(String(text || '').slice(lastIndex));
      return result;
    }

    function escapeHtml(value) {
      return String(value || '').replace(/[&<>"]/g, (char) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[char]));
    }

    function escapeAttr(value) { return escapeHtml(value).replace(/'/g, '&#039;'); }

    function showLoadError(error) {
      el('loading').classList.add('hidden');
      el('loadError').classList.remove('hidden');
      el('loadError').textContent = error.message || String(error);
    }
  </script>
</body>
</html>
